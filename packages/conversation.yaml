homeassistant:
  customize:  
  
input_text:
  announce_textbox:
    name: announce_textbox

automation:
  - alias: calendar_announce
    trigger:
      - platform: calendar
        event: start
        entity_id: calendar.teamcarriger_gmail_com
    condition:
      - condition: template
        value_template: "{{ 'Announce' in trigger.calendar_event.summary }}"
    actions:
      - action: assist_satellite.announce
        metadata: {}
        data:
          message: "{{ trigger.calendar_event.description }}"
        target:
          area_id:
            - 36a7e54132e84284a4368f292e945bb0
            - 63db88fe052b434c86e1d37781ce0972
            - 259e54ef72a347c2b9fa159e5bcd32b7

  - id: button_announce
    alias: button_announce
    triggers:
      - trigger: state
        entity_id: input_text.announce_textbox
    actions:
          - action: assist_satellite.announce
            metadata: {}
            data:
              message: "{{ states('input_text.announce_textbox') }}"
            target:
              area_id:
                - 36a7e54132e84284a4368f292e945bb0
                - 63db88fe052b434c86e1d37781ce0972
                - 259e54ef72a347c2b9fa159e5bcd32b7
          
  - id: girls_bed_time
    alias: Girls Bed Time
    mode: single
    triggers:
      - trigger: conversation
        command: "bed time"
      - trigger: conversation
        command: "bedtime"
    conditions: []
    actions:
      - action: fan.turn_on
        target:
          entity_id: fan.emi_fan
      - action: light.turn_off
        target:
          entity_id: light.emi_fan_light
      - action: light.turn_on
        target:
          entity_id: light.girls_bedroom_eth_va_emi_star
        data:
          brightness_pct: 65
          effect: "none"
      - action: light.turn_on
        target:
          entity_id: light.girls_bedroom_eth_va_lottie_star
        data:
          brightness_pct: 100
          effect: "none"
      - action: light.turn_on
        target:
          entity_id:
            - light.girls_bedroom_eth_va_lottie_bed
            - light.girls_bedroom_eth_va_room_light
        data:
          brightness_pct: 100
          effect: "Twinkle"
          
  - id: girls_night_time
    alias: Girls Night Time
    mode: single
    triggers:
      # Voice trigger
      - trigger: conversation
        command:
          - "night time"
          - "nighttime"

      # 9:00 PM trigger
      - trigger: time
        at: "21:00:00"

    conditions: []

    actions:
      - choose:

          ###########################################################
          # Voice Trigger Actions
          ###########################################################
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'conversation' }}"
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.emi_fan_light
                    - light.girls_bedroom_eth_va_lottie_star
                    - light.girls_bedroom_eth_va_lottie_bed
                    - light.girls_bedroom_eth_va_room_light
                    - light.hallway

          ###########################################################
          # 9PM Flash Sequence (ONLY if Emi star is ON)
          ###########################################################
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.platform == 'time'
                     and is_state('light.girls_bedroom_eth_va_emi_star', 'on') }}
            sequence:

              - repeat:
                  count: 3
                  sequence:

                    - action: light.turn_on
                      target:
                        entity_id: light.girls_bedroom_eth_va_emi_star
                      data:
                        brightness_pct: 65
                        transition: 3

                    - delay: "00:00:03"

                    - action: light.turn_on
                      target:
                        entity_id: light.girls_bedroom_eth_va_emi_star
                      data:
                        brightness_pct: 15
                        transition: 3

                    - delay: "00:00:03"
