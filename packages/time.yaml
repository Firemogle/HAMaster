homeassistant:
  customize:
  
binary_sensor:
#Define times of day for the house, early, morning, afternoon, evening and night
  - platform: tod
    name: early_morning
    after: '05:30'
    before: sunrise

  - platform: tod
    name: morning
    after: sunrise
    before: '12:00'

  - platform: tod
    name: afternoon
    after: '12:00'
    before: sunset
    before_offset: '-00:30'

  - platform: tod
    name: evening
    after: sunset
    after_offset: '-00:30'
    before: '23:59'

  - platform: tod
    name: night
    after: '23:59'
    before: '05:30'


input_boolean:
  school_day:
    name: school_day

template:
  - binary_sensor:
      - name: house_time_workday_combine
        state: >
          {{ is_state('binary_sensor.workday_raw', 'on')
             and is_state('calendar.us_holidays', 'off') }}
  - binary_sensor:
      - name: work_wakeup_time
        state: >
          {{ is_state('binary_sensor.early_morning', 'on') }}
          
  - binary_sensor:
      - name: house_wake_for_work
        state: >
          {{ is_state('binary_sensor.house_time_workday_combine', 'on') 
             and is_state('binary_sensor.work_wakeup_time', 'on')  }}  

  - binary_sensor:
      - name: house_weekend_wakeup
        state: >
          {{ is_state('binary_sensor.workday_raw', 'off') 
             and is_state('binary_sensor.morning', 'on')  }} 
  - binary_sensor:
      - name: house_wakeup
        state: >
          {{ is_state('binary_sensor.house_wake_for_work', 'on') 
             or is_state('binary_sensor.house_weekend_wakeup', 'on')  }} 


  - binary_sensor:
      - name: house_wakeup_vacation_morning
        state: >
          {{ is_state('binary_sensor.early_morning', 'on') 
             and is_state('binary_sensor.house_sts_vacation', 'on')  }}
             

  - binary_sensor:
      - name: house_wakeup_vacation_evening
        state: >
          {{ is_state('binary_sensor.evening', 'on') 
             and is_state('binary_sensor.house_sts_vacation', 'on')  }}

  - binary_sensor:
      - name: house_school_day
        unique_id: house_school_day
        state: >
          {{ is_state('input_boolean.school_day', 'on') }}
        icon: mdi:school
          
  
automation:
  - id: 'house_wakeup'
    alias: house_wakeup
    initial_state: 'off'
    trigger:
      - platform: state
        entity_id: binary_sensor.house_wakeup
        to: 'on'
    action:
      - service: script.turn_on
        target:
          entity_id:
            - script.hvac_run_stop_uni
            - script.house_wakeup
      - service: vacuum.start
        target:
          device_id: 4ae8bbe13f1911ebb6d7f167204f6863
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_xmas_lights
                state: 'on'
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.xmas_light
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_fountain
                state: 'on'
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.front_outlets

  - id: 'house_evening_mode'
    alias: house_evening_mode
    initial_state: 'off'
    trigger:
      - platform: state
        entity_id: binary_sensor.evening
        to: 'on'
    action:
      - service: script.turn_on
        target:
          entity_id:
            - script.hvac_run_stop_uni
            - script.house_evening
            - script.shades_close
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_independence_day
                state: 'on'
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.independence_day
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_xmas_lights
                state: 'on'
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.xmas_light
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_halloween
                state: 'on'
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.halloween_light

  - id: house_night_mode
    alias: house_night_mode
    initial_state: 'off'
    trigger:
      - platform: state
        entity_id: binary_sensor.night
        to: 'on'
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.garage_door
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_vacation
                state: 'on'
            sequence:
              - service: alarm_control_panel.alarm_arm_away
                data:
                  entity_id: alarm_control_panel.alarm_panel
                  code: !secret alarmcode
        default:
          - service: alarm_control_panel.alarm_arm_home
            data:
              entity_id: alarm_control_panel.alarm_panel
              code: !secret alarmcode
      - service: script.turn_on
        target:
          entity_id:
            - script.hvac_run_stop_uni
            - script.house_night
            - script.ext_lights_off
            - script.front_door_lock
            - script.update_all_esphome_devices

  - id: 'ext_lights_off'
    alias: ext_lights_off
    initial_state: 'off'
    trigger:
      - platform: state
        entity_id: binary_sensor.morning
        to: 'on'
      - platform: state
        entity_id: binary_sensor.morning
        to: 'on'
        for:
          hours: 1
          minutes: 30
          seconds: 0
    action:
      - service: script.turn_on
        target:
          entity_id: script.ext_lights_off
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.house_sts_xmas_lights
                state: 'on'
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.front_outlets

  - id: shade_schedule
    alias: Shade Schedule
    mode: single
    trigger:
      - platform: time
        at: "06:45:00"
        id: workday
      - platform: time
        at: "08:30:00"
        id: non_workday
      - platform: time
        at: "09:00:00"
        id: morning_close
    action:
      - choose:
          # 7:30 AM on workdays - open shade
          - conditions:
              - condition: trigger
                id: workday
              - condition: state
                entity_id: binary_sensor.house_time_workday_combine
                state: "on"
            sequence:
              - service: cover.set_cover_position
                target:
                  entity_id: cover.master_shade
                data:
                  position: 100
              - service: cover.set_cover_position
                target:
                  entity_id: cover.kidsroom_girls_blinds
                data:
                  position: 100
              - service: cover.set_cover_position
                target:
                  entity_id: cover.main_bath_main_bath_shade
                data:
                  position: 100

          # 8:30 AM on non-workdays - open shade
          - conditions:
              - condition: trigger
                id: non_workday
              - condition: state
                entity_id: binary_sensor.house_time_workday_combine
                state: "off"
            sequence:
              - service: cover.set_cover_position
                target:
                  entity_id: cover.master_shade
                data:
                  position: 100
              - service: cover.set_cover_position
                target:
                  entity_id: cover.kidsroom_girls_blinds
                data:
                  position: 100
              - service: cover.set_cover_position
                target:
                  entity_id: cover.main_bath_main_bath_shade
                data:
                  position: 100
          - conditions:
              - condition: trigger
                id: morning_close
              - condition: state
                entity_id: binary_sensor.house_sts_hvac_cool_req
                state: "on"
            sequence:
              - service: script.turn_on
                target:
                  entity_id:
                    - script.shades_close     
                      
  - id: school_bus_announcement
    alias: School Bus Announcement
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: state
        entity_id: binary_sensor.house_school_day
        state: "on"
    action:
      - service: conversation.process
        data:
          agent_id: conversation.ollama_conversation
          text: "Tell Emilia that she should be leaving for the bus. Keep it at one to two sentences long"
        response_variable: ollama_response

      - service: assist_satellite.announce
        target:
          entity_id: all
        data:
          message: "{{ ollama_response.response.speech.plain.speech }}"
          preannounce: true
    mode: single

  - id: 'school_day_on'
    alias: school_day_on
    trigger:
      - platform: calendar
        event: start
        entity_id: calendar.teamcarriger_gmail_com
      - platform: calendar
        event: end
        entity_id: calendar.teamcarriger_gmail_com
    condition:
      - condition: template
        value_template: "{{ 'School day' in trigger.calendar_event.summary }}"
    action:
      - if:
          - "{{ trigger.event == 'start' }}"
        then:
          - service: input_boolean.turn_on
            entity_id: input_boolean.school_day
        else:
          - service: input_boolean.turn_off
            entity_id: input_boolean.school_day
    mode: queued
