automation:
  - id: 'kansas_playing'
    alias: kansas_playing
    trigger:
    - entity_id: sensor.kansas_basketball
      platform: state
      from:
        - "PRE"
        - "IN"
      to:
        - "IN"
        - "POST"
    - entity_id: sensor.kansas_football
      platform: state
      from:
        - "PRE"
        - "IN"
      to:
        - "IN"
        - "POST"
    - entity_id: sensor.kansas_volleyball
      platform: state
      from:
        - "PRE"
        - "IN"
      to:
        - "IN"
        - "POST"
    condition: []
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'IN' }}"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.jayhawk_lamp_req
          - service: light.turn_on
            data:
              entity_id: light.jayhawk_candle
          - data_template:
              message: "Jayhawks be playing."
            service: notify.group_notify
        else:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.jayhawk_lamp_req
          - service: light.turn_off
            target:
              entity_id: light.jayhawk_candle
    mode: queued
  - id: 'chiefs_playing'
    alias: chiefs_playing
    trigger:
    - entity_id: sensor.kansas_city_chiefs
      platform: state
      from:
        - "PRE"
        - "IN"
      to:
        - "IN"
        - "POST"
    condition: []
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'IN' }}"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.chiefs_lamp_req
          - data_template:
              message: "Chiefs be playing."
            service: notify.group_notify
        else:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.chiefs_lamp_req
    mode: queued


input_boolean:
  chiefs_lamp_req:
    initial: false
