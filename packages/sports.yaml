automation:
  - id: sports_lighting
    alias: Sports Lighting
    trigger:
      - platform: state
        entity_id:
          - sensor.kansas_basketball
          - sensor.kansas_football
          - sensor.kansas_volleyball
        from:
          - "PRE"
          - "IN"
        to:
          - "IN"
          - "POST"
        id: jayhawks

      - platform: state
        entity_id: sensor.kansas_city_chiefs
        from:
          - "PRE"
          - "IN"
        to:
          - "IN"
          - "POST"
        id: chiefs

    action:
      - choose:
          - conditions:
              - condition: trigger
                id: jayhawks
              - condition: template
                value_template: >
                  {{ is_state('sensor.kansas_basketball', 'IN')
                     or is_state('sensor.kansas_football', 'IN')
                     or is_state('sensor.kansas_volleyball', 'IN') }}
            sequence:
              - action: layers.set
                target:
                  entity_id:
                    - light.uhall_ban_hall_ban
                    - light.cabinet_top
                data:
                  layer: jayhawks
                  priority: 90
                  state: "on"
                  brightness: 255
                  color_name: white
                  effect: "Jayhawks"

              - action: layers.set
                target:
                  entity_id: light.jayhawk_candle
                data:
                  layer: jayhawks
                  priority: 90
                  state: "on"

              - action: notify.group_notify
                data:
                  message: "Jayhawks be playing."

          - conditions:
              - condition: trigger
                id: jayhawks
              - condition: template
                value_template: >
                  {{ not is_state('sensor.kansas_basketball', 'IN')
                     and not is_state('sensor.kansas_football', 'IN')
                     and not is_state('sensor.kansas_volleyball', 'IN') }}
            sequence:
              - action: layers.clear
                data:
                  layer: jayhawks

          - conditions:
              - condition: trigger
                id: chiefs
              - condition: state
                entity_id: sensor.kansas_city_chiefs
                state: "IN"
            sequence:
              - action: layers.set
                target:
                  entity_id:
                    - light.uhall_ban_hall_ban
                    - light.cabinet_top
                data:
                  layer: chiefs
                  priority: 80
                  state: "on"
                  brightness: 255
                  color_name: white
                  effect: "Chiefs"

              - action: notify.group_notify
                data:
                  message: "Chiefs be playing."

          - conditions:
              - condition: trigger
                id: chiefs
              - condition: state
                entity_id: sensor.kansas_city_chiefs
                state: "POST"
            sequence:
              - action: layers.clear
                data:
                  layer: chiefs
