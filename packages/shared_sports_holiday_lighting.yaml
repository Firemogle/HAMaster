input_boolean:
  chiefs_lamp_req:
    name: Chiefs Lamp Request
    initial: false

input_select:
  shared_lighting_base_profile:
    name: Shared Lighting Base Profile
    options:
      - home
      - night

automation:
  - id: shared_lighting_priority
    alias: Shared Lighting Priority
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_boolean.jayhawk_lamp_req
          - input_boolean.chiefs_lamp_req
          - input_boolean.house_sts_xmas_lights
          - input_boolean.halloween
          - input_boolean.independence_day
          - input_select.shared_lighting_base_profile
      - platform: homeassistant
        event: start
    action:
      - service: script.shared_lighting_update

script:
  shared_lighting_update:
    alias: Shared Lighting Priority Controller
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.jayhawk_lamp_req
                state: "on"
            sequence:
              - service: script.shared_lighting_jayhawks
          - conditions:
              - condition: state
                entity_id: input_boolean.chiefs_lamp_req
                state: "on"
            sequence:
              - service: script.shared_lighting_chiefs
          - conditions:
              - condition: state
                entity_id: input_boolean.house_sts_xmas_lights
                state: "on"
            sequence:
              - service: script.shared_lighting_christmas
          - conditions:
              - condition: state
                entity_id: input_boolean.halloween
                state: "on"
            sequence:
              - service: script.shared_lighting_halloween
        default:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_select.shared_lighting_base_profile
                    state: night
                sequence:
                  - service: script.shared_lighting_night_base
            default:
              - service: script.shared_lighting_home_base

  shared_lighting_jayhawks:
    alias: Shared Lighting - Jayhawks
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id:
            - light.uhall_ban_hall_ban
            - light.cabinet_top
        data:
          brightness: 255
          color_name: white
          effect: "Jayhawks"

  shared_lighting_chiefs:
    alias: Shared Lighting - Chiefs
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id:
            - light.uhall_ban_hall_ban
            - light.cabinet_top
        data:
          brightness: 255
          color_name: white
          effect: "Chiefs"

  shared_lighting_christmas:
    alias: Shared Lighting - Christmas
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id:
            - light.uhall_ban_hall_ban
            - light.cabinet_top
        data:
          brightness: 255
          effect: "Rainbow"

  shared_lighting_halloween:
    alias: Shared Lighting - Halloween
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id:
            - light.uhall_ban_hall_ban
            - light.cabinet_top
        data:
          brightness: 255
          color_name: purple
          effect: "Dithering Lights"

  shared_lighting_home_base:
    alias: Shared Lighting - Home Base
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id: light.cabinet_top
        data:
          brightness_pct: 60
          effect: none
      - service: light.turn_on
        target:
          entity_id: light.uhall_ban_hall_ban
        data:
          brightness_pct: 25
          effect: none

  shared_lighting_night_base:
    alias: Shared Lighting - Night Base
    mode: restart
    sequence:
      - service: light.turn_on
        target:
          entity_id:
            - light.cabinet_top
            - light.uhall_ban_hall_ban
        data:
          brightness_pct: 25
          rgb_color: [255, 255, 255]
          effect: none
