esphome:
  name: irrigation-manifold-front
  friendly_name: Irrigation Manifold Front

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret AP
  password: !secret APPW

logger:

api:
  encryption:
    key: !secret ENC_KEY

ota:
  - platform: esphome
    encryption:

bluetooth_proxy:

udp:

packet_transport:
  platform: udp
  update_interval: 1s
  encryption: !secret ENC_KEY
  rolling_code_enable: true
  ping_pong_enable: true
  ping_pong_recycle_time: 5s
  binary_sensors:
    - tx_zone1_state
    - tx_zone2_state
    - tx_zone3_state
    - tx_fountain_state
    - tx_birdbath_state
  providers:
    - name: rainbarrel
      encryption: !secret ENC_KEY

switch:
  - platform: gpio
    name: zone1_valve
    id: zone1_valve
    pin:
      number: GPIO05
      inverted: false
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: zone2_valve
    id: zone2_valve
    pin:
      number: GPIO04
      inverted: false
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: zone3_valve
    id: zone3_valve
    pin:
      number: GPIO16
      inverted: false
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: fountain_valve
    id: fountain_valve
    pin:
      number: GPIO17
      inverted: false
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: birdbath_valve
    id: birdbath_valve
    pin:
      number: GPIO18
      inverted: false
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: packet_transport
    provider: rainbarrel
    remote_id: cmd_zone1
    id: rx_cmd_zone1
    on_press:
      then:
        - switch.turn_on: zone1_valve
    on_release:
      then:
        - switch.turn_off: zone1_valve

  - platform: packet_transport
    provider: rainbarrel
    remote_id: cmd_zone2
    id: rx_cmd_zone2
    on_press:
      then:
        - switch.turn_on: zone2_valve
    on_release:
      then:
        - switch.turn_off: zone2_valve

  - platform: packet_transport
    provider: rainbarrel
    remote_id: cmd_zone3
    id: rx_cmd_zone3
    on_press:
      then:
        - switch.turn_on: zone3_valve
    on_release:
      then:
        - switch.turn_off: zone3_valve

  - platform: packet_transport
    provider: rainbarrel
    remote_id: cmd_fountain
    id: rx_cmd_fountain
    on_press:
      then:
        - switch.turn_on: fountain_valve
    on_release:
      then:
        - switch.turn_off: fountain_valve

  - platform: packet_transport
    provider: rainbarrel
    remote_id: cmd_birdbath
    id: rx_cmd_birdbath
    on_press:
      then:
        - switch.turn_on: birdbath_valve
    on_release:
      then:
        - switch.turn_off: birdbath_valve

  - platform: packet_transport
    type: status
    provider: rainbarrel
    name: "Front Manifold Master Link"
    id: master_link_status
    on_release:
      then:
        - switch.turn_off: zone1_valve
        - switch.turn_off: zone2_valve
        - switch.turn_off: zone3_valve
        - switch.turn_off: fountain_valve
        - switch.turn_off: birdbath_valve

  - platform: template
    id: tx_zone1_state
    lambda: return id(zone1_valve).state;
  - platform: template
    id: tx_zone2_state
    lambda: return id(zone2_valve).state;
  - platform: template
    id: tx_zone3_state
    lambda: return id(zone3_valve).state;
  - platform: template
    id: tx_fountain_state
    lambda: return id(fountain_valve).state;
  - platform: template
    id: tx_birdbath_state
    lambda: return id(birdbath_valve).state;
