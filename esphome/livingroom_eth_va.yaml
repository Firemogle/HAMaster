substitutions:
  devicename: livingroom_eth_va

packages:
  base_board: !include 
    file: packages/poe_board_base_2.6.yaml
    vars:
      devicename: ${devicename}
  voice_board: !include 
    file: packages/va_board_2.0.yaml
    vars:
      devicename: ${devicename}
  occupancy: !include
    file: packages/LD2410.yaml
    vars:
      devicename: ${devicename}
  motorboard: !include
    file: packages/motorboard.yaml
    vars:
      index: 0
  curtain: !include
    file: packages/curtain.yaml
    vars:
      index: 0
      motor: 1
      sensorpin: 0
  sheercurtain: !include
    file: packages/curtain.yaml
    vars:
      index: 0
      motor: 2
      sensorpin: 1
  screen: !include 
    file: packages/addressable_screen.yaml
    vars:
      pin: GPIO48


sensor:   
  - platform: bmp280_i2c
    temperature:
      name: ${devicename}_ext_temp
      oversampling: 16x
    pressure:
      name: ${devicename}_ext_pressure
    address: 0x76
    i2c_id: i2c_channel
    update_interval: 60s  


# LD2410 uses its default 0.75 m gate resolution; gate 8 is approximately 6 m (19.7 ft),
# which is the sensor's maximum range and matches the roughly 20 ft room depth.
number:
  - platform: ld2410
    ld2410_id: ld2410_sensor
    max_move_distance_gate:
      id: livingroom_ld2410_max_move_distance
    max_still_distance_gate:
      id: livingroom_ld2410_max_still_distance

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - number.set:
          id: livingroom_ld2410_max_move_distance
          value: 8
      - number.set:
          id: livingroom_ld2410_max_still_distance
          value: 8
