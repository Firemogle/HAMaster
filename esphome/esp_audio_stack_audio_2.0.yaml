# Test-only replacement for packages/audio.yaml using n-IA-hane/esphome-audio-stack.
# Hardware preserved from the office VA configuration:
#   I2S: MCLK GPIO02, BCLK GPIO17, LRCLK GPIO45
#   RX:  GPIO16
#   TX:  GPIO15
#   ES7210 ADC @ 0x40 on audio_i2c
#   ES8311 DAC @ 0x18 on audio_i2c
#
# This intentionally omits AEC/AFE for the first migration test.

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@main
    components: [esp_audio_stack]

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO02
  i2s_din_pin: GPIO16
  i2s_dout_pin: GPIO15
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  buffers_in_psram: true
  codec:
    i2c_id: audio_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 24.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  tdm_total_slots: 4
  tdm_mic_slot: 0

microphone:
  - platform: esp_audio_stack
    id: external_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: i2s_audio_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 10s

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: 10s
      - id: media_mixing_input
        timeout: 10s

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: ${devicename}_media
    id: ${devicename}_media
    media_pipeline:
      speaker: media_resampling_speaker
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    files:
      id: timer_finished_sound
      file: packages/sounds/alarm.mp3
    on_idle:
      - micro_wake_word.stop:
      - delay: 2s
      - micro_wake_word.start:
