packages:
  va_board: !include
    file: voice-scripts.yaml
    vars:
      devicename: ${devicename}

globals:
  - id: thunderstorm_pending
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    name: ${devicename}_thunderstorm_playback
    id: thunderstorm_playback
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: play_thunderstorm
      - switch.turn_off: thunderstorm_playback

script:
  - id: play_thunderstorm
    mode: restart
    then:
      - delay: 3s
      - media_player.stop:
          id: ${devicename}_media
      - delay: 250ms
      - media_player.play_media:
          id: ${devicename}_media
          media_url: "http://192.168.2.2:8123/local/thunder.mp3"

voice_assistant:
  id: va
  microphone: external_mic
  media_player: ${devicename}_media
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31 dbfs
  volume_multiplier: 10
  on_client_connected:
    - lambda: id(init_in_progress) = true;
    - script.execute: control_leds
    - micro_wake_word.start:
    - lambda: id(init_in_progress) = false;
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_end:
    - if:
        condition:
          lambda: |-
            return esphome::str_equals_case_insensitive(x, "play thunderstorm sounds");
        then:
          - lambda: id(thunderstorm_pending) = true;
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_tts_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: control_leds
  on_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
    - wait_until:
        not:
          voice_assistant.is_running
    - if:
        condition:
          lambda: return id(thunderstorm_pending);
        then:
          - wait_until:
              not:
                media_player.is_announcing:
          - lambda: id(thunderstorm_pending) = false;
          - script.execute: play_thunderstorm
    - micro_wake_word.start:
    - light.turn_off:
        id: ${devicename}_status
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

micro_wake_word:
  microphone: external_mic
  models:
    - model: okay_nabu
  vad:
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - if:
              condition:
                media_player.is_announcing:
              then:
                media_player.stop:
                  announcement: true
              else:
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;
    - light.turn_on:
        id: ${devicename}_status
        brightness: 50%
        transition_length: 0s
