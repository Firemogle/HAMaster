packages:
  light_effects: !include
    file: light_effects.yaml
    vars:
      devicename: ${name}
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    pin: ${pin}
    num_leds: ${length}
    channel_colors: ${color_line}
    internal: true
    name: ${name}
    id: ${name}
    use_dma: false
    rmt_symbols: 96
    effects:
          - addressable_color_wipe:
              name: voice_listen
              colors:
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 9%
                  blue: 90%
                  num_leds: 9
                  gradient: true
              add_led_interval: 100ms
              reverse: False
          - addressable_color_wipe:
              name: voice_thinking
              colors:
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 9%
                  blue: 90%
                  num_leds: 3
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 9%
                  blue: 90%
                  num_leds: 3
                  gradient: true
              add_led_interval: 50ms
              reverse: False
          - addressable_color_wipe:
              name: voice_replying
              colors:
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 9%
                  blue: 90%
                  num_leds: 3
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 9%
                  blue: 90%
                  num_leds: 3
                  gradient: true
              add_led_interval: 50ms
              reverse: true
          - addressable_lambda:
              name: timer_tick
              update_interval: 500ms
              lambda: |-
                const float fraction = id(${devicename}_timer_fraction_remaining).state;
                const float segment = 100.0f / 12.0f;
      
                // Clamp the remaining percentage to the 0-100 range.
                const float remaining = fmaxf(0.0f, fminf(100.0f, fraction));
      
                // Start with all 12 LEDs fully red.
                for (int i = 0; i < 12; i++) {
                  it[i] = Color(255, 0, 0);
                }
      
                // Number of complete 8.33% segments remaining.
                const int full_segments =
                    static_cast<int>(remaining / segment);
      
                // Set completed segments to full white,
                // starting at the lowest LED.
                for (int i = 0; i < full_segments && i < 12; i++) {
                  it[i] = Color(255, 255, 255);
                }
      
                // Use the remainder for the next LED.
                if (full_segments < 12) {
                  const float remainder =
                      fmodf(remaining, segment) / segment;
      
                  // Remainder 0 = full red.
                  // Remainder 1 = full white.
                  const uint8_t white_level =
                      static_cast<uint8_t>(255.0f * remainder);
      
                  it[full_segments] =
                      Color(255, white_level, white_level);
                }
          - addressable_color_wipe:
              name: timer_ring
              colors:
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 90%
                  blue: 9%
                  num_leds: 3
                - red: 100%
                  green: 100%
                  blue: 100%
                  num_leds: 3
                  gradient: true
                - red: 0%
                  green: 90%
                  blue: 9%
                  num_leds: 3
                  gradient: true
              add_led_interval: 50ms
              reverse: false
      