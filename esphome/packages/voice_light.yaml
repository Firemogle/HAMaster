packages:
  light_effects: !include 
    file: light_effects.yaml
    vars:
      devicename: ${name}

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    pin: ${pin}
    num_leds: ${length}
    channel_colors: ${color_line}
    internal: true 
    name: ${name}
    id: ${name}
    use_dma: false
    rmt_symbols: 96
    effects:
      - addressable_color_wipe:
          name: voice_listen
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 9%
              blue: 90%
              num_leds: 9
              gradient: true
          add_led_interval: 100ms
          reverse: False
      - addressable_color_wipe:
          name: voice_thinking
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 9%
              blue: 90%
              num_leds: 3
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 9%
              blue: 90%
              num_leds: 3
              gradient: true
          add_led_interval: 50ms
          reverse: False
      - addressable_color_wipe:
          name: voice_replying
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 9%
              blue: 90%
              num_leds: 3
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 9%
              blue: 90%
              num_leds: 3
              gradient: true
          add_led_interval: 50ms
          reverse: true
      - addressable_lambda:
          name: timer_tick
          update_interval: 100ms
          lambda: |-
            const auto &timer = id(first_active_timer);
            const uint32_t total_seconds = max(timer.total_seconds, static_cast<uint32_t>(1));
            const float remaining_leds =
                static_cast<float>(it.size()) *
                static_cast<float>(timer.seconds_left) /
                static_cast<float>(total_seconds);

            // Countdown runs from the last LED toward the first.
            // Each LED fades from red to white during its one-twelfth
            // portion of the timer.
            for (int i = 0; i < it.size(); i++) {
              const float position = static_cast<float>(it.size() - 1 - i);
              const float white_progress = min(
                  max(position - remaining_leds + 1.0f, 0.0f),
                  1.0f
              );

              const uint8_t green_blue =
                  static_cast<uint8_t>(255.0f * white_progress);
              it[i] = Color(255, green_blue, green_blue);
            }
      - addressable_color_wipe:
          name: timer_ring
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 90%
              blue: 9%
              num_leds: 3
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 3
              gradient: true
            - red: 0%
              green: 90%
              blue: 9%
              num_leds: 3
              gradient: true
          add_led_interval: 50ms
          reverse: false
