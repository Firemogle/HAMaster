i2c_device:
  - id: es8311_raw
    i2c_id: audio_i2c
    address: 0x18

esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: sr_low_cost

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO2
  i2s_din_pin: GPIO16
  i2s_dout_pin: GPIO15
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 16  # 16-bit TDM slots x4
  bits_per_sample: "16"
  # Do NOT set dma_frame_num here: shrinking the DMA backlog below the auto
  # sizing (~10 ms/descriptor) causes audible TX underruns on this device.
  correct_dc_offset: true
  processor_id: aec_processor
  # ── TDM hardware AEC reference (slot map measured on the S3-Box-3) ──
  # ES7210 MIC numbering is NOT 1:1 with TDM slot order; the slots carry
  # MIC1, MIC3, MIC2, MIC4. The board loops the ES8311 DAC output back into
  # MIC3, which lands on TDM slot 1.
  codec:
    i2c_id: audio_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 24.0        # mic PGA
      ref_channel: 2       # MIC3 = the DAC loopback channel
      ref_gain_db: 0.0     # unity PGA — higher gains clip the line-level loopback
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  tdm_total_slots: 4
  tdm_mic_slots: [0]       # slot 0 = MIC1 (esp_aec is single-mic)
  tdm_ref_slot: 1          # slot 1 = MIC3 = DAC loopback
  use_tdm_reference: true
  buffers_in_psram: true
  audio_task_stack_in_psram: true
  aec_reference: previous_frame   # ignored while use_tdm_reference is set
    


speaker:
  - platform: esp_audio_stack
    id: i2s_audio_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    # audio-stack v2026.7.0 changed the platform default from 500ms to
    # 'never' — keep the validated auto-stop behavior explicit.
    timeout: 500ms
  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: 10s
      - id: media_mixing_input
        timeout: 10s

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    name: ${devicename}_media
    id: ${devicename}_media
    media_pipeline:
      speaker: media_resampling_speaker # FLAC is the least processor intensive codec
    announcement_pipeline:
      speaker: announcement_resampling_speaker     # FLAC is the least processor intensive codec
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    files:
      id: timer_finished_sound
      file: packages/sounds/alarm.mp3
    on_idle:
    - micro_wake_word.stop:
    - delay: 2s
    - micro_wake_word.start:
      
microphone:
  - platform: esp_audio_stack
    id: external_mic
    esp_audio_stack_id: audio_stack
