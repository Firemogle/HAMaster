i2c_device:
  - id: aic3204_diag
    address: 0x18
    i2c_id: audio_i2c

button:
  - platform: template
    name: ${devicename}_aic3204_diagnostic
    id: ${devicename}_aic3204_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            uint8_t value;

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP: PAGE 0 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x00)) {
              for (uint8_t reg = 0x00; reg <= 0x7F; reg++) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P0 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGW("aic3204_diag", "P0 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 0");
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP: PAGE 1 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x01)) {
              for (uint8_t reg = 0x00; reg <= 0x7F; reg++) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P1 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGW("aic3204_diag", "P1 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 1");
            }

            if (!id(aic3204_diag).write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_diag", "Failed to restore page 0");
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP COMPLETE ===");

  - platform: template
    name: ${devicename}_aic3204_forum_fix_check
    id: ${devicename}_aic3204_forum_fix_check
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;

            ESP_LOGI("aic3204_diag",
                     "=== TI E2E FORUM FIX CHECK: P1 REGISTER 0x0A ===");
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_diag", "Failed to select page 1");
              codec->write_byte(0x00, 0x00);
              return;
            }

            if (codec->read_byte(0x0A, &value)) {
              ESP_LOGI("aic3204_diag",
                       "P1 R0A = 0x%02X; D1=%u; D1 %s",
                       value, (value >> 1) & 0x01,
                       (value & 0x02) ? "SET (forum says clear)" :
                                        "CLEAR (matches forum suggestion)");
            } else {
              ESP_LOGE("aic3204_diag", "Read failed for P1 R0A");
            }

            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_diag", "Failed to restore page 0");
            }
            ESP_LOGI("aic3204_diag",
                     "Read-only check complete; no codec settings changed");

  - platform: template
    name: ${devicename}_aic3204_internal_beep_preserve_output
    id: ${devicename}_aic3204_internal_beep_preserve_output
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = true;
            bool restore_ok = true;

            const uint8_t p0_regs[] = {
              0x3C, 0x3F, 0x40, 0x41, 0x42,
              0x47, 0x48, 0x49, 0x4A, 0x4B, 0x4C, 0x4D, 0x4E, 0x4F
            };
            uint8_t p0_saved[sizeof(p0_regs)] = {};
            const uint8_t p1_regs[] = {0x09, 0x0C, 0x0D, 0x10, 0x11, 0x14};
            uint8_t p1_saved[sizeof(p1_regs)] = {};

            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "Cannot select page 0; aborting");
              return;
            }
            for (size_t i = 0; i < sizeof(p0_regs); i++) {
              if (!codec->read_byte(p0_regs[i], &p0_saved[i])) {
                ESP_LOGE("aic3204_test", "Cannot read P0 R%02X; aborting",
                         p0_regs[i]);
                ok = false;
              }
            }
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_test", "Cannot select page 1; aborting");
              return;
            }
            for (size_t i = 0; i < sizeof(p1_regs); i++) {
              if (!codec->read_byte(p1_regs[i], &p1_saved[i])) {
                ESP_LOGE("aic3204_test", "Cannot read P1 R%02X; aborting",
                         p1_regs[i]);
                ok = false;
              }
            }
            if (!ok) {
              codec->write_byte(0x00, 0x00);
              ESP_LOGE("aic3204_test", "Could not snapshot all registers; test aborted");
              return;
            }

            ESP_LOGI("aic3204_test",
                     "Saved output config: P1 R09=%02X R0C=%02X R0D=%02X R10=%02X R11=%02X R14=%02X",
                     p1_saved[0], p1_saved[1], p1_saved[2],
                     p1_saved[3], p1_saved[4], p1_saved[5]);

            // Leave P1 output-driver power, routing, gain, and startup settings
            // untouched during the beep. Only configure the existing P0 beep path.
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "Cannot reselect page 0; test aborted");
              return;
            }
            auto write_p0 = [&](uint8_t reg, uint8_t data) {
              if (!codec->write_byte(reg, data)) {
                ESP_LOGE("aic3204_test", "I2C write failed P0 R%02X <- %02X",
                         reg, data);
                ok = false;
              }
            };
            write_p0(0x3F, 0x14);
            delay(20);
            write_p0(0x3C, 0x19);
            write_p0(0x3F, 0xD4);
            write_p0(0x40, 0x00);
            write_p0(0x41, 0x00);
            write_p0(0x42, 0x00);
            write_p0(0x47, 0x00);
            write_p0(0x48, 0x00);
            write_p0(0x49, 0x03);
            write_p0(0x4A, 0xA9);
            write_p0(0x4B, 0x80);
            write_p0(0x4C, 0x10);
            write_p0(0x4D, 0xD8);
            write_p0(0x4E, 0x7E);
            write_p0(0x4F, 0xE3);
            write_p0(0x47, 0x80);

            ESP_LOGI("aic3204_test",
                     "Preserve-output beep running for 5 seconds; setup writes %s",
                     ok ? "succeeded" : "had errors");
            if (codec->write_byte(0x00, 0x00)) {
              const uint8_t watch_p0[] = {0x3C, 0x3F, 0x40, 0x41, 0x42,
                                          0x47, 0x48, 0x49, 0x4A, 0x4B,
                                          0x4C, 0x4D, 0x4E, 0x4F};
              for (uint8_t reg : watch_p0) {
                if (codec->read_byte(reg, &value))
                  ESP_LOGI("aic3204_test", "TEST P0 R%02X=%02X", reg, value);
              }
            }
            if (codec->write_byte(0x00, 0x01)) {
              for (uint8_t reg : p1_regs) {
                if (codec->read_byte(reg, &value))
                  ESP_LOGI("aic3204_test", "TEST P1 R%02X=%02X", reg, value);
              }
            }
            delay(5000);

            // Restore all touched page-0 values, then the exact page-1 snapshot.
            codec->write_byte(0x00, 0x00);
            codec->write_byte(0x47, 0x00);
            codec->write_byte(0x3F, 0x14);
            delay(20);
            for (size_t i = 0; i < sizeof(p0_regs); i++) {
              if (!codec->write_byte(p0_regs[i], p0_saved[i])) {
                ESP_LOGE("aic3204_test", "Restore P0 R%02X failed", p0_regs[i]);
                restore_ok = false;
              }
            }
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_test", "Cannot select page 1 for restore");
              restore_ok = false;
            } else {
              for (size_t i = 0; i < sizeof(p1_regs); i++) {
                if (!codec->write_byte(p1_regs[i], p1_saved[i])) {
                  ESP_LOGE("aic3204_test", "Restore P1 R%02X failed", p1_regs[i]);
                  restore_ok = false;
                }
              }
            }
            codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_test",
                     "Preserve-output beep test complete; register restore %s",
                     restore_ok ? "succeeded" : "had errors");
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_internal_beep_forum_sequence
    id: ${devicename}_aic3204_internal_beep_forum_sequence
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            bool ok = true;
            bool restore_ok = true;
            uint8_t value = 0;

            // Save every register this test changes so normal 48 kHz playback
            // configuration can be restored even if the forum sequence times out.
            const uint8_t p0_regs[] = {0x0B, 0x40, 0x47, 0x48};
            uint8_t saved[sizeof(p0_regs)] = {};
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_forum_beep", "Cannot select page 0; aborting");
              return;
            }
            for (size_t i = 0; i < sizeof(p0_regs); i++) {
              if (!codec->read_byte(p0_regs[i], &saved[i])) {
                ESP_LOGE("aic3204_forum_beep", "Snapshot failed P0 R%02X", p0_regs[i]);
                ok = false;
              }
            }
            if (!ok) {
              codec->write_byte(0x00, 0x00);
              ESP_LOGE("aic3204_forum_beep", "Snapshot incomplete; test aborted safely");
              return;
            }

            auto write_p0 = [&](uint8_t reg, uint8_t data) {
              if (!codec->write_byte(reg, data)) {
                ESP_LOGE("aic3204_forum_beep", "Write failed P0 R%02X <- %02X", reg, data);
                ok = false;
              }
            };
            auto read_p0 = [&](uint8_t reg, uint8_t *out) -> bool {
              if (!codec->write_byte(0x00, 0x00)) return false;
              return codec->read_byte(reg, out);
            };

            ESP_LOGI("aic3204_forum_beep",
                     "Starting TI E2E beep sequence; saved NDAC=%02X DAC_MUTE=%02X R47=%02X R48=%02X",
                     saved[0], saved[1], saved[2], saved[3]);

            // Forum setup: beep gain -40 dB. Keep this separate from the trigger write.
            write_p0(0x47, 0x28);
            write_p0(0x48, 0x28);

            // Mute DACs, then wait up to 500 ms for mute flags in P0/R26:
            // Forum mask xxx1xxx1 corresponds to bits 4 and 0 (0x11).
            write_p0(0x40, 0x0C);
            uint32_t start = millis();
            bool muted = false;
            while (millis() - start < 500) {
              if (read_p0(0x26, &value) && (value & 0x11) == 0x11) {
                muted = true;
                break;
              }
              delay(5);
            }
            ESP_LOGI("aic3204_forum_beep", "DAC mute flags P0/R26=%02X; confirmed=%s",
                     value, muted ? "yes" : "NO (continuing with bounded test)");

            // TI forum sequence: disable NDAC, trigger beep, restore NDAC, unmute.
            write_p0(0x0B, 0x02);
            delay(5);
            write_p0(0x47, 0x8C);
            delay(5);
            write_p0(0x0B, 0x82);
            write_p0(0x40, 0x00);

            // Wait for beep-in-progress bit (R47 bit 7) to clear, max 5 seconds.
            start = millis();
            bool beep_done = false;
            while (millis() - start < 5000) {
              if (read_p0(0x47, &value) && (value & 0x80) == 0) {
                beep_done = true;
                break;
              }
              delay(10);
            }
            ESP_LOGI("aic3204_forum_beep",
                     "Beep wait ended: P0/R47=%02X; completion flag cleared=%s",
                     value, beep_done ? "yes" : "NO (timeout)");

            // Restore in a safe order: stop beep, restore NDAC, restore mute state,
            // then restore beep registers to their pre-test values.
            if (!codec->write_byte(0x00, 0x00)) restore_ok = false;
            if (!codec->write_byte(0x47, 0x00)) restore_ok = false;
            if (!codec->write_byte(0x0B, saved[0])) restore_ok = false;
            if (!codec->write_byte(0x40, saved[1])) restore_ok = false;
            if (!codec->write_byte(0x47, saved[2])) restore_ok = false;
            if (!codec->write_byte(0x48, saved[3])) restore_ok = false;
            if (!codec->write_byte(0x00, 0x00)) restore_ok = false;

            ESP_LOGI("aic3204_forum_beep",
                     "TI E2E beep test complete; setup=%s mute_confirmed=%s beep_completed=%s restore=%s",
                     ok ? "OK" : "WRITE ERRORS",
                     muted ? "yes" : "no",
                     beep_done ? "yes" : "timeout",
                     restore_ok ? "OK" : "ERROR");
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_internal_beep
    id: ${devicename}_aic3204_internal_beep
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool writes_ok = true;

            auto write = [&](uint8_t reg, uint8_t data) {
              if (!codec->write_byte(reg, data)) {
                ESP_LOGE("aic3204_test",
                         "I2C WRITE FAILED P0 R%02X <- %02X",
                         reg, data);
                writes_ok = false;
              }
            };

            auto dump = [&](const char *stage) {
              ESP_LOGI("aic3204_test", "========== %s ==========", stage);

              for (uint8_t page = 0; page <= 1; page++) {
                if (!codec->write_byte(0x00, page)) {
                  ESP_LOGE("aic3204_test", "%s: page %u select failed",
                           stage, page);
                  continue;
                }

                ESP_LOGI("aic3204_test", "----- PAGE %u -----", page);

                // Read all register addresses on pages 0 and 1.
                for (uint8_t reg = 1; reg <= 0x7F; reg++) {
                  if (codec->read_byte(reg, &value)) {
                    if (page == 0 && reg == 0x25) {
                      // P0/R25 is read-only DAC Flag Register 1.
                      ESP_LOGI("aic3204_test",
                               "P0 R25 DAC status=%02X: LDAC=%s LOL=%s HPL=%s RDAC=%s LOR=%s HPR=%s",
                               value,
                               (value & 0x80) ? "ON" : "OFF",
                               (value & 0x40) ? "ON" : "OFF",
                               (value & 0x20) ? "ON" : "OFF",
                               (value & 0x08) ? "ON" : "OFF",
                               (value & 0x04) ? "ON" : "OFF",
                               (value & 0x02) ? "ON" : "OFF");
                    } else {
                      ESP_LOGI("aic3204_test", "P%u R%02X = %02X",
                               page, reg, value);
                    }
                  } else {
                    ESP_LOGE("aic3204_test", "P%u R%02X READ FAILED",
                             page, reg);
                  }
                }
              }

              if (!codec->write_byte(0x00, 0x00)) {
                ESP_LOGE("aic3204_test", "%s: failed to restore page 0", stage);
              }
            };

            dump("BEEP BEFORE CONFIGURATION");

            if (codec->write_byte(0x00, 0x01)) {
              auto hp_write = [&](uint8_t reg, uint8_t data) {
                if (!codec->write_byte(reg, data)) {
                  ESP_LOGE("aic3204_test",
                           "I2C WRITE FAILED P1 R%02X <- %02X",
                           reg, data);
                  writes_ok = false;
                }
              };
              hp_write(0x14, 0x25);
              hp_write(0x0C, 0x08);
              hp_write(0x0D, 0x08);
              hp_write(0x10, 0x00);
              hp_write(0x11, 0x00);
              hp_write(0x09, 0x30);
            } else {
              ESP_LOGE("aic3204_test", "Failed to select page 1");
              writes_ok = false;
            }
            delay(100);

            if (codec->write_byte(0x00, 0x00)) {
              // P0/R25 is a read-only DAC flag register, not a power control.
              // Power down both DAC channels through P0/R63 (0x3F), preserving
              // the non-power bits from the normal 0xD4 setup value.
              write(0x3F, 0x14);
              delay(20);
              write(0x3C, 0x19);
              write(0x3F, 0xD4);
              write(0x40, 0x00);
              write(0x41, 0x00);
              write(0x42, 0x00);
              write(0x47, 0x00);
              write(0x48, 0x00);
              write(0x49, 0x03);
              write(0x4A, 0xA9);
              write(0x4B, 0x80);
              write(0x4C, 0x10);
              write(0x4D, 0xD8);
              write(0x4E, 0x7E);
              write(0x4F, 0xE3);
              write(0x47, 0x80);
            } else {
              ESP_LOGE("aic3204_test", "Failed to select page 0");
              writes_ok = false;
            }

            ESP_LOGI("aic3204_test", "Beep setup writes %s",
                     writes_ok ? "succeeded" : "HAD ERRORS");
            dump("BEEP IMMEDIATE READBACK");

        - delay: 1s
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;

            ESP_LOGI("aic3204_test", "========== BEEP READBACK AFTER 1 SECOND ==========");
            for (uint8_t page = 0; page <= 1; page++) {
              if (!codec->write_byte(0x00, page)) {
                ESP_LOGE("aic3204_test", "1-second readback: page %u select failed",
                         page);
                continue;
              }

              ESP_LOGI("aic3204_test", "----- PAGE %u -----", page);
              for (uint8_t reg = 1; reg <= 0x7F; reg++) {
                if (codec->read_byte(reg, &value)) {
                  if (page == 0 && reg == 0x25) {
                    ESP_LOGI("aic3204_test",
                             "P0 R25 DAC status=%02X: LDAC=%s LOL=%s HPL=%s RDAC=%s LOR=%s HPR=%s",
                             value,
                             (value & 0x80) ? "ON" : "OFF",
                             (value & 0x40) ? "ON" : "OFF",
                             (value & 0x20) ? "ON" : "OFF",
                             (value & 0x08) ? "ON" : "OFF",
                             (value & 0x04) ? "ON" : "OFF",
                             (value & 0x02) ? "ON" : "OFF");
                  } else {
                    ESP_LOGI("aic3204_test", "P%u R%02X = %02X",
                             page, reg, value);
                  }
                } else {
                  ESP_LOGE("aic3204_test", "P%u R%02X READ FAILED",
                           page, reg);
                }
              }
            }

            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "1-second readback: page 0 restore failed");
            }
        - delay: 5s
        - lambda: |-
            auto *codec = id(aic3204_diag);
            codec->write_byte(0x00, 0x00);
            codec->write_byte(0x47, 0x00);
            // P0/R25 is read-only (DAC Flag Register 1). Power down via P0/R63.
            codec->write_byte(0x3F, 0x14);
            delay(20);
            codec->write_byte(0x3C, 0x01);
            codec->write_byte(0x3F, 0xD4);
            codec->write_byte(0x40, 0x00);
            codec->write_byte(0x00, 0x01);
            codec->write_byte(0x10, 0x00);
            codec->write_byte(0x11, 0x00);
            codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_test", "Beep test complete; restored PRB_P1");
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_i2s_test_tone
    id: ${devicename}_aic3204_i2s_test_tone
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            id(i2s_audio_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(i2s_audio_speaker).set_volume(1.0f);
            id(i2s_audio_speaker).set_mute_state(false);
            id(i2s_audio_speaker).start();
            ESP_LOGI("aic3204_test", "Starting direct 48kHz/32-bit/stereo standard-I2S test tone for ~20 seconds");
        - delay: 1s
        - repeat:
            count: 190
            then:
              - lambda: |-
                  std::vector<uint8_t> data;
                  constexpr uint32_t sample_count = 4800;  // 100 ms at 48 kHz
                  constexpr uint32_t period = 48;         // 1 kHz square wave
                  constexpr int32_t amplitude = 0x20000000;

                  data.reserve(sample_count * 2 * sizeof(int32_t));

                  for (uint32_t i = 0; i < sample_count; i++) {
                    const int32_t sample =
                        ((i % period) < (period / 2)) ? amplitude : -amplitude;
                    const uint32_t raw = static_cast<uint32_t>(sample);

                    for (uint8_t channel = 0; channel < 2; channel++) {
                      data.push_back(static_cast<uint8_t>(raw & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 8) & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 16) & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 24) & 0xFF));
                    }
                  }

                  const size_t expected = data.size();
                  const size_t written = id(i2s_audio_speaker).play(
                      data.data(), data.size(), pdMS_TO_TICKS(50));
                  if (written != expected) {
                    ESP_LOGW("aic3204_test",
                             "I2S chunk short write: accepted %u of %u bytes",
                             static_cast<unsigned>(written),
                             static_cast<unsigned>(expected));
                  }
              - delay: 100ms
        - speaker.finish:
            id: i2s_audio_speaker
        - logger.log: "AIC3204 direct I2S test tone complete"
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_playback_diagnostic
    id: ${devicename}_aic3204_playback_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - logger.log: "=== AIC3204 PLAYBACK DIAGNOSTIC QUEUED: 20 SECOND DELAY ==="
        - delay: 20s
        - logger.log: "=== AIC3204 TEST START: IDLE REGISTER SNAPSHOT ==="
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            const uint8_t regs[] = {
              0x04, 0x05, 0x0B, 0x0C, 0x0E, 0x11,
              0x12, 0x13, 0x14, 0x18, 0x19, 0x1B,
              0x1F, 0x20, 0x38, 0x3C, 0x3F, 0x40,
              0x41, 0x42
            };
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "IDLE: failed to select page 0");
              return;
            }
            for (uint8_t reg : regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_test", "IDLE P0 R%02X = %02X", reg, value);
              else
                ESP_LOGE("aic3204_test", "IDLE P0 R%02X READ FAILED", reg);
            }
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_test", "IDLE: failed to select page 1");
              return;
            }
            const uint8_t hp_regs[] = {
              0x01, 0x02, 0x03, 0x04, 0x09, 0x0C, 0x0D,
              0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14
            };
            for (uint8_t reg : hp_regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_test", "IDLE P1 R%02X = %02X", reg, value);
              else
                ESP_LOGE("aic3204_test", "IDLE P1 R%02X READ FAILED", reg);
            }
            codec->write_byte(0x00, 0x00);
        - lambda: |-
            id(i2s_audio_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(i2s_audio_speaker).set_volume(1.0f);
            id(i2s_audio_speaker).set_mute_state(false);
            id(i2s_audio_speaker).start();
            ESP_LOGI("aic3204_test",
                     "I2S speaker started; beginning waveform after register snapshot");
        - delay: 1s
        - repeat:
            count: 190
            then:
              - lambda: |-
                  std::vector<uint8_t> data;
                  constexpr uint32_t sample_count = 4800;  // 100 ms at 48 kHz
                  constexpr uint32_t period = 48;         // 1 kHz square wave
                  constexpr int32_t amplitude = 0x20000000;

                  data.reserve(sample_count * 2 * sizeof(int32_t));

                  for (uint32_t i = 0; i < sample_count; i++) {
                    const int32_t sample =
                        ((i % period) < (period / 2)) ? amplitude : -amplitude;
                    const uint32_t raw = static_cast<uint32_t>(sample);

                    for (uint8_t channel = 0; channel < 2; channel++) {
                      data.push_back(static_cast<uint8_t>(raw & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 8) & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 16) & 0xFF));
                      data.push_back(static_cast<uint8_t>((raw >> 24) & 0xFF));
                    }
                  }

                  const size_t expected = data.size();
                  const size_t written = id(i2s_audio_speaker).play(
                      data.data(), data.size(), pdMS_TO_TICKS(50));
                  if (written != expected) {
                    ESP_LOGW("aic3204_test",
                             "I2S chunk short write: accepted %u of %u bytes",
                             static_cast<unsigned>(written),
                             static_cast<unsigned>(expected));
                  }
              - delay: 100ms

        - logger.log: "=== AIC3204 PLAYBACK REGISTER SNAPSHOT ==="
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            const uint8_t regs[] = {
              0x04, 0x05, 0x0B, 0x0C, 0x0E, 0x11,
              0x12, 0x13, 0x14, 0x18, 0x19, 0x1B,
              0x1F, 0x20, 0x38, 0x3C, 0x3F, 0x40,
              0x41, 0x42
            };
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "PLAYBACK: failed to select page 0");
              return;
            }
            for (uint8_t reg : regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_test", "PLAYBACK P0 R%02X = %02X", reg, value);
              else
                ESP_LOGE("aic3204_test", "PLAYBACK P0 R%02X READ FAILED", reg);
            }
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_test", "PLAYBACK: failed to select page 1");
              return;
            }
            const uint8_t hp_regs[] = {
              0x01, 0x02, 0x03, 0x04, 0x09, 0x0C, 0x0D,
              0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14
            };
            for (uint8_t reg : hp_regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_test", "PLAYBACK P1 R%02X = %02X", reg, value);
              else
                ESP_LOGE("aic3204_test", "PLAYBACK P1 R%02X READ FAILED", reg);
            }
            codec->write_byte(0x00, 0x00);
        - speaker.finish:
            id: i2s_audio_speaker
        - logger.log: "=== AIC3204 END OF TEST ==="
        - delay: 1s
        - micro_wake_word.start:

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO39
    i2s_bclk_pin:
      number: GPIO17
    i2s_mclk_pin:
      number: GPIO02
  - id: audio_bus_out
    i2s_lrclk_pin:
      number: GPIO45
    i2s_bclk_pin:
      number: GPIO47
    i2s_mclk_pin:
      number: GPIO48

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: audio_i2c

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB
    i2c_id: audio_i2c

speaker:
  - platform: i2s_audio
    i2s_audio_id: audio_bus_out
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO01
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 32bit
    mclk_multiple: 512
    use_apll: true
    i2s_comm_fmt: stand_i2s
    channel: stereo
    audio_dac: aic3204_dac
    timeout: 10s
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: 10s
      - id: media_mixing_input
        timeout: 10s
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    name: ${devicename}_media
    id: ${devicename}_media
    media_pipeline:
      speaker: media_resampling_speaker
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    files:
      id: timer_finished_sound
      file: packages/sounds/alarm.mp3
    on_idle:
    - micro_wake_word.stop:
    - delay: 2s
    - micro_wake_word.start:

microphone:
  - platform: i2s_audio
    i2s_audio_id: audio_bus
    id: external_mic
    adc_type: external
    pdm: false
    i2s_din_pin: GPIO42
    bits_per_sample: 16bit
