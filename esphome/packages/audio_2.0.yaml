i2c_device:
  - id: aic3204_diag
    address: 0x18
    i2c_id: audio_i2c

button:
  - platform: template
    name: ${devicename}_aic3204_diagnostic
    id: ${devicename}_aic3204_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            uint8_t value;

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP: PAGE 0 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x00)) {
              for (uint8_t reg = 0x00; reg <= 0x7F; reg++) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P0 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGW("aic3204_diag", "P0 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 0");
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP: PAGE 1 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x01)) {
              for (uint8_t reg = 0x00; reg <= 0x7F; reg++) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P1 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGW("aic3204_diag", "P1 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 1");
            }

            if (!id(aic3204_diag).write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_diag", "Failed to restore page 0");
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 FULL REGISTER DUMP COMPLETE ===");

  - platform: template
    name: ${devicename}_aic3204_internal_beep
    id: ${devicename}_aic3204_internal_beep
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool writes_ok = true;

            auto write = [&](uint8_t reg, uint8_t data) {
              if (!codec->write_byte(reg, data)) {
                ESP_LOGE("aic3204_test",
                         "I2C WRITE FAILED P0 R%02X <- %02X",
                         reg, data);
                writes_ok = false;
              }
            };

            auto dump = [&](const char *stage) {
              if (!codec->write_byte(0x00, 0x00)) {
                ESP_LOGE("aic3204_test", "%s: page 0 select failed", stage);
                return;
              }
              const uint8_t regs[] = {
                0x25, 0x3C, 0x3F, 0x40, 0x41, 0x42,
                0x47, 0x48, 0x49, 0x4A, 0x4B,
                0x4C, 0x4D, 0x4E, 0x4F
              };
              ESP_LOGI("aic3204_test", "=== %s ===", stage);
              for (uint8_t reg : regs) {
                if (codec->read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_test", "P0 R%02X = %02X",
                           reg, value);
                } else {
                  ESP_LOGE("aic3204_test", "P0 R%02X READ FAILED", reg);
                }
              }
              if (!codec->write_byte(0x00, 0x01)) {
                ESP_LOGE("aic3204_test", "%s: page 1 select failed", stage);
                return;
              }
              const uint8_t hp_regs[] = {0x09, 0x0C, 0x0D, 0x10, 0x11};
              for (uint8_t reg : hp_regs) {
                if (codec->read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_test", "P1 R%02X = %02X",
                           reg, value);
                } else {
                  ESP_LOGE("aic3204_test", "P1 R%02X READ FAILED", reg);
                }
              }
              if (!codec->write_byte(0x00, 0x00)) {
                ESP_LOGE("aic3204_test", "%s: page 0 restore failed", stage);
              }
            };

            dump("BEEP BEFORE CONFIGURATION");

            if (codec->write_byte(0x00, 0x01)) {
              auto hp_write = [&](uint8_t reg, uint8_t data) {
                if (!codec->write_byte(reg, data)) {
                  ESP_LOGE("aic3204_test",
                           "I2C WRITE FAILED P1 R%02X <- %02X",
                           reg, data);
                  writes_ok = false;
                }
              };
              hp_write(0x14, 0x25);
              hp_write(0x0C, 0x08);
              hp_write(0x0D, 0x08);
              hp_write(0x10, 0x00);
              hp_write(0x11, 0x00);
              hp_write(0x09, 0x30);
            } else {
              ESP_LOGE("aic3204_test", "Failed to select page 1");
              writes_ok = false;
            }
            delay(100);

            if (codec->write_byte(0x00, 0x00)) {
              write(0x25, 0x00);
              delay(20);
              write(0x3C, 0x19);
              write(0x3F, 0xD4);
              write(0x40, 0x00);
              write(0x41, 0x00);
              write(0x42, 0x00);
              write(0x47, 0x00);
              write(0x48, 0x00);
              write(0x49, 0x03);
              write(0x4A, 0xA9);
              write(0x4B, 0x80);
              write(0x4C, 0x10);
              write(0x4D, 0xD8);
              write(0x4E, 0x7E);
              write(0x4F, 0xE3);
              write(0x47, 0x80);
            } else {
              ESP_LOGE("aic3204_test", "Failed to select page 0");
              writes_ok = false;
            }

            ESP_LOGI("aic3204_test", "Beep setup writes %s",
                     writes_ok ? "succeeded" : "HAD ERRORS");
            dump("BEEP IMMEDIATE READBACK");

        - delay: 1s
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "1-second readback: page 0 select failed");
              return;
            }
            ESP_LOGI("aic3204_test", "=== BEEP READBACK AFTER 1 SECOND ===");
            const uint8_t regs[] = {
              0x25, 0x3C, 0x3F, 0x40, 0x41, 0x42,
              0x47, 0x48, 0x49, 0x4A, 0x4B,
              0x4C, 0x4D, 0x4E, 0x4F
            };
            for (uint8_t reg : regs) {
              if (codec->read_byte(reg, &value)) {
                ESP_LOGI("aic3204_test", "P0 R%02X = %02X", reg, value);
              } else {
                ESP_LOGE("aic3204_test", "P0 R%02X READ FAILED", reg);
              }
            }
            if (codec->write_byte(0x00, 0x01)) {
              const uint8_t hp_regs[] = {0x09, 0x0C, 0x0D, 0x10, 0x11};
              for (uint8_t reg : hp_regs) {
                if (codec->read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_test", "P1 R%02X = %02X", reg, value);
                } else {
                  ESP_LOGE("aic3204_test", "P1 R%02X READ FAILED", reg);
                }
              }
              codec->write_byte(0x00, 0x00);
            } else {
              ESP_LOGE("aic3204_test", "1-second readback: page 1 select failed");
            }

        - delay: 5s
        - lambda: |-
            auto *codec = id(aic3204_diag);
            codec->write_byte(0x00, 0x00);
            codec->write_byte(0x47, 0x00);
            codec->write_byte(0x25, 0x00);
            delay(20);
            codec->write_byte(0x3C, 0x01);
            codec->write_byte(0x3F, 0xD4);
            codec->write_byte(0x40, 0x00);
            codec->write_byte(0x00, 0x01);
            codec->write_byte(0x10, 0x00);
            codec->write_byte(0x11, 0x00);
            codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_test", "Beep test complete; restored PRB_P1");
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_i2s_test_tone
    id: ${devicename}_aic3204_i2s_test_tone
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        - lambda: |-
            id(i2s_audio_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(i2s_audio_speaker).set_volume(1.0f);
            id(i2s_audio_speaker).set_mute_state(false);
            id(i2s_audio_speaker).start();
            ESP_LOGI("aic3204_test", "Starting direct 48kHz/32-bit/stereo standard-I2S test tone for ~20 seconds");
        - delay: 100ms
        - repeat:
            count: 190
            then:
              - speaker.play:
                  id: i2s_audio_speaker
                  data: !lambda |-
                    std::vector<uint8_t> data;
                    constexpr uint32_t sample_count = 4800;  // 100 ms at 48 kHz
                    constexpr uint32_t period = 48;         // 1 kHz square wave
                    constexpr int32_t amplitude = 0x20000000;

                    data.reserve(sample_count * 2 * sizeof(int32_t));

                    for (uint32_t i = 0; i < sample_count; i++) {
                      const int32_t sample =
                          ((i % period) < (period / 2)) ? amplitude : -amplitude;
                      const uint32_t raw = static_cast<uint32_t>(sample);

                      for (uint8_t channel = 0; channel < 2; channel++) {
                        data.push_back(static_cast<uint8_t>(raw & 0xFF));
                        data.push_back(static_cast<uint8_t>((raw >> 8) & 0xFF));
                        data.push_back(static_cast<uint8_t>((raw >> 16) & 0xFF));
                        data.push_back(static_cast<uint8_t>((raw >> 24) & 0xFF));
                      }
                    }

                    return data;
              - delay: 10ms
        - speaker.finish:
            id: i2s_audio_speaker
        - logger.log: "AIC3204 direct I2S test tone complete"
        - delay: 1s
        - micro_wake_word.start:

  - platform: template
    name: ${devicename}_aic3204_playback_diagnostic
    id: ${devicename}_aic3204_playback_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - micro_wake_word.stop:
        - media_player.stop: ${devicename}_media
        - logger.log: "=== AIC3204 PLAYBACK DIAGNOSTIC QUEUED: 10 SECOND DELAY ==="
        - delay: 10s

        # Snapshot before playback begins.
        - logger.log: "=== AIC3204 TEST START: IDLE REGISTER SNAPSHOT ==="
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            const uint8_t regs[] = {
              0x04, 0x05, 0x11, 0x12, 0x13, 0x14,
              0x18, 0x19, 0x3F, 0x40, 0x41, 0x42
            };

            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_test", "IDLE: failed to select page 0");
              return;
            }

            for (uint8_t reg : regs) {
              if (codec->read_byte(reg, &value)) {
                ESP_LOGI("aic3204_test", "IDLE P0 R%02X = %02X", reg, value);
              } else {
                ESP_LOGE("aic3204_test", "IDLE P0 R%02X READ FAILED", reg);
              }
            }

            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_test", "IDLE: failed to select page 1");
              return;
            }

            const uint8_t hp_regs[] = {0x09, 0x0C, 0x0D};
            for (uint8_t reg : hp_regs) {
              if (codec->read_byte(reg, &value)) {
                ESP_LOGI("aic3204_test", "IDLE P1 R%02X = %02X", reg, value);
              } else {
                ESP_LOGE("aic3204_test", "IDLE P1 R%02X READ FAILED", reg);
              }
            }

            codec->write_byte(0x00, 0x00);

        # Start the same direct I2S waveform as the existing test.
        - lambda: |-
            id(i2s_audio_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(i2s_audio_speaker).set_volume(1.0f);
            id(i2s_audio_speaker).set_mute_state(false);
            id(i2s_audio_speaker).start();
            ESP_LOGI("aic3204_test",
                     "PLAYBACK ACTIVE: 1kHz square wave, 48kHz, 32-bit stereo");

        # Playback and register capture run concurrently.
        - parallel:
            # Approximately 20 seconds of continuous test waveform.
            - sequence:
                - repeat:
                    count: 190
                    then:
                      - speaker.play:
                          id: i2s_audio_speaker
                          data: !lambda |-
                            std::vector<uint8_t> data;
                            constexpr uint32_t sample_count = 4800;
                            constexpr uint32_t period = 48;
                            constexpr int32_t amplitude = 0x20000000;

                            data.reserve(sample_count * 2 * sizeof(int32_t));

                            for (uint32_t i = 0; i < sample_count; i++) {
                              const int32_t sample =
                                  ((i % period) < (period / 2))
                                  ? amplitude : -amplitude;
                              const uint32_t raw = static_cast<uint32_t>(sample);

                              for (uint8_t channel = 0; channel < 2; channel++) {
                                data.push_back(static_cast<uint8_t>(raw & 0xFF));
                                data.push_back(static_cast<uint8_t>((raw >> 8) & 0xFF));
                                data.push_back(static_cast<uint8_t>((raw >> 16) & 0xFF));
                                data.push_back(static_cast<uint8_t>((raw >> 24) & 0xFF));
                              }
                            }
                            return data;
                      - delay: 10ms
                - speaker.finish:
                    id: i2s_audio_speaker

            # Capture codec state while playback is underway.
            - sequence:
                - delay: 1s
                - logger.log: "=== AIC3204 PLAYBACK REGISTER SNAPSHOT ==="
                - lambda: |-
                    auto *codec = id(aic3204_diag);
                    uint8_t value = 0;
                    const uint8_t regs[] = {
                      0x04, 0x05, 0x11, 0x12, 0x13, 0x14,
                      0x18, 0x19, 0x3F, 0x40, 0x41, 0x42
                    };

                    if (!codec->write_byte(0x00, 0x00)) {
                      ESP_LOGE("aic3204_test", "PLAYBACK: failed to select page 0");
                      return;
                    }

                    for (uint8_t reg : regs) {
                      if (codec->read_byte(reg, &value)) {
                        ESP_LOGI("aic3204_test", "PLAYBACK P0 R%02X = %02X",
                                 reg, value);
                      } else {
                        ESP_LOGE("aic3204_test",
                                 "PLAYBACK P0 R%02X READ FAILED", reg);
                      }
                    }

                    if (!codec->write_byte(0x00, 0x01)) {
                      ESP_LOGE("aic3204_test", "PLAYBACK: failed to select page 1");
                      return;
                    }

                    const uint8_t hp_regs[] = {0x09, 0x0C, 0x0D};
                    for (uint8_t reg : hp_regs) {
                      if (codec->read_byte(reg, &value)) {
                        ESP_LOGI("aic3204_test", "PLAYBACK P1 R%02X = %02X",
                                 reg, value);
                      } else {
                        ESP_LOGE("aic3204_test",
                                 "PLAYBACK P1 R%02X READ FAILED", reg);
                      }
                    }

                    codec->write_byte(0x00, 0x00);

        - logger.log: "=== AIC3204 END OF TEST ==="
        - delay: 1s
        - micro_wake_word.start:

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO39
    i2s_bclk_pin:
      number: GPIO17
    i2s_mclk_pin:
      number: GPIO02
  - id: audio_bus_out
    i2s_lrclk_pin:
      number: GPIO45
    i2s_bclk_pin:
      number: GPIO47
    i2s_mclk_pin:
      number: GPIO48

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: audio_i2c

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB
    i2c_id: audio_i2c

speaker:
  - platform: i2s_audio
    i2s_audio_id: audio_bus_out
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO01
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 32bit
    mclk_multiple: 512
    use_apll: true
    i2s_comm_fmt: stand_i2s
    channel: stereo
    audio_dac: aic3204_dac
    timeout: 10s
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: 10s
      - id: media_mixing_input
        timeout: 10s
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    name: ${devicename}_media
    id: ${devicename}_media
    media_pipeline:
      speaker: media_resampling_speaker
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    files:
      id: timer_finished_sound
      file: packages/sounds/alarm.mp3
    on_idle:
    - micro_wake_word.stop:
    - delay: 2s
    - micro_wake_word.start:

microphone:
  - platform: i2s_audio
    i2s_audio_id: audio_bus
    id: external_mic
    adc_type: external
    pdm: false
    i2s_din_pin: GPIO42
    bits_per_sample: 16bit
