i2c_device:
  - id: aic3204_diag
    address: 0x18
    i2c_id: audio_i2c

button:
  - platform: template
    name: ${devicename}_aic3204_diagnostic
    id: ${devicename}_aic3204_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            uint8_t value;

            ESP_LOGI("aic3204_diag", "=== AIC3204 PAGE 0 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x00)) {
              const uint8_t page0_regs[] = {
                0x04, 0x05, 0x06, 0x0B, 0x0C, 0x0E,
                0x1B, 0x1F, 0x20, 0x24, 0x25, 0x26,
                0x27, 0x28, 0x29, 0x2A, 0x2B, 0x2C,
                0x2D, 0x2E, 0x38, 0x3C, 0x3F, 0x40,
                0x41, 0x42
              };
              for (uint8_t reg : page0_regs) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P0 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGE("aic3204_diag", "P0 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 0");
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 CLOCK/STATUS ===");
            if (id(aic3204_diag).write_byte(0x00, 0x00)) {
              const uint8_t status_regs[] = {0x2A, 0x2B, 0x2C, 0x2D, 0x2E};
              for (uint8_t reg : status_regs) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "STATUS P0 0x%02X = 0x%02X", reg, value);
                }
              }
            }

            ESP_LOGI("aic3204_diag", "=== AIC3204 PAGE 1 ===");
            if (id(aic3204_diag).write_byte(0x00, 0x01)) {
              const uint8_t page1_regs[] = {
                0x01, 0x02, 0x03, 0x04, 0x09, 0x0A,
                0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11,
                0x12, 0x13, 0x14, 0x7B
              };
              for (uint8_t reg : page1_regs) {
                if (id(aic3204_diag).read_byte(reg, &value)) {
                  ESP_LOGI("aic3204_diag", "P1 0x%02X = 0x%02X", reg, value);
                } else {
                  ESP_LOGE("aic3204_diag", "P1 0x%02X READ FAILED", reg);
                }
              }
            } else {
              ESP_LOGE("aic3204_diag", "Failed to select page 1");
            }

            // Leave the codec on page 0, matching the normal ESPHome AIC3204
            // driver's steady-state configuration.
            id(aic3204_diag).write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_diag", "=== AIC3204 DIAGNOSTIC COMPLETE ===");

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO39
    i2s_bclk_pin:
      number: GPIO17
    i2s_mclk_pin:
      number: GPIO02
  - id: audio_bus_out
    i2s_lrclk_pin:
      number: GPIO45
    i2s_bclk_pin:
      number: GPIO47
    i2s_mclk_pin:
      number: GPIO48

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: audio_i2c

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB
    i2c_id: audio_i2c

speaker:
  - platform: i2s_audio
    i2s_audio_id: audio_bus_out
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO01
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 32bit
    mclk_multiple: 512
    use_apll: true
    channel: stereo
    audio_dac: aic3204_dac
    timeout: 10s
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: 10s
      - id: media_mixing_input
        timeout: 10s
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    name: ${devicename}_media
    id: ${devicename}_media
    media_pipeline:
      speaker: media_resampling_speaker
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    files:
      id: timer_finished_sound
      file: packages/sounds/alarm.mp3
    on_idle:
    - micro_wake_word.stop:
    - delay: 2s
    - micro_wake_word.start:

microphone:
  - platform: i2s_audio
    i2s_audio_id: audio_bus
    id: external_mic
    adc_type: external
    pdm: false
    i2s_din_pin: GPIO42
    bits_per_sample: 16bit
