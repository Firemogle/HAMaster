substitutions:
  devicename: eth_va_27test

packages:
  base_board: !include
    file: packages/poe_board_base_2.6.yaml
    vars:
      devicename: ${devicename}

# TEMPORARY AIC3204 playback test.
# Replaces the voice/audio package for this test; remove this block and restore
# the voice_board include after testing.
i2s_audio:
  - id: aic3204_i2s
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO47
    i2s_mclk_pin: GPIO48

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: audio_i2c

speaker:
  - platform: i2s_audio
    id: aic3204_speaker
    i2s_audio_id: aic3204_i2s
    i2s_dout_pin: GPIO01
    dac_type: external
    audio_dac: aic3204_dac
    sample_rate: 48000
    bits_per_sample: 32bit
    mclk_multiple: 512
    use_apll: true
    i2s_comm_fmt: stand_i2s
    channel: stereo
    timeout: 5s

pcf8574:
  - id: pcf8574_hub
    address: 0x20
    pcf8575: false
    i2c_id: i2c_channel

switch:
  - platform: gpio
    id: ${devicename}_amp_en
    name: ${devicename}_amp_en
    pin:
      pcf8574: pcf8574_hub
      number: 0
      mode:
        output: true
      inverted: false

binary_sensor:
  - platform: gpio
    id: ${devicename}_aux_det_ic
    name: ${devicename}_aux_det_ic
    pin:
      pcf8574: pcf8574_hub
      number: 1
      mode:
        input: true
      inverted: false
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: ${devicename}_aux_det_ic
            then:
              - switch.turn_off: ${devicename}_amp_en
            else:
              - switch.turn_on: ${devicename}_amp_en

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: ${devicename}_aux_det_ic
          then:
            - switch.turn_off: ${devicename}_amp_en
          else:
            - switch.turn_on: ${devicename}_amp_en

# Temporary headphone gain sweep. Test with headphones disconnected first.
i2c_device:
  - id: aic3204_diag
    address: 0x18
    i2c_id: audio_i2c


globals:
  - id: hp_saved_l
    type: uint8_t
    initial_value: '0'
  - id: hp_saved_r
    type: uint8_t
    initial_value: '0'
  - id: hp_sweep_gain
    type: int
    initial_value: '-6'
  - id: hp_sweep_failed
    type: bool
    initial_value: 'false'
  - id: hp_sweep_chunk
    type: int
    initial_value: '0'

script:
  - id: hp_sweep_script
    mode: single
    then:
      - repeat:
          # 36 gain settings, 100 small tone chunks per setting.
          count: 3600
          then:
            - if:
                condition:
                  lambda: 'return !id(hp_sweep_failed);'
                then:
                  - lambda: |-
                      auto *codec = id(aic3204_diag);

                      if (id(hp_sweep_chunk) == 0) {
                        const uint8_t gain =
                            static_cast<uint8_t>(id(hp_sweep_gain) + 6);
                        if (!codec->write_byte(0x00, 0x01) ||
                            !codec->write_byte(0x10, gain) ||
                            !codec->write_byte(0x11, gain)) {
                          ESP_LOGE("hp_sweep", "Gain write failed at %+d dB",
                                   id(hp_sweep_gain));
                          id(hp_sweep_failed) = true;
                          return;
                        }

                        uint8_t check_l = 0, check_r = 0;
                        if (!codec->read_byte(0x10, &check_l) ||
                            !codec->read_byte(0x11, &check_r)) {
                          ESP_LOGE("hp_sweep", "Gain readback failed at %+d dB",
                                   id(hp_sweep_gain));
                          id(hp_sweep_failed) = true;
                          return;
                        }

                        ESP_LOGI("hp_sweep", "STEP gain=%+d dB HPL=%02X HPR=%02X",
                                 id(hp_sweep_gain), check_l, check_r);
                      }

                      // Emit one 1 ms, 1 kHz stereo tone chunk per automation
                      // iteration; the delay below gives ESPHome time to run.
                      std::vector<uint8_t> data;
                      constexpr int32_t amplitude = 0x01000000;
                      data.reserve(48 * 2 * sizeof(int32_t));

                      for (uint32_t i = 0; i < 48; i++) {
                        const int32_t sample = (i < 24)
                            ? amplitude : -amplitude;
                        const uint32_t raw = static_cast<uint32_t>(sample);
                        for (uint8_t ch = 0; ch < 2; ch++) {
                          data.push_back(raw & 0xFF);
                          data.push_back((raw >> 8) & 0xFF);
                          data.push_back((raw >> 16) & 0xFF);
                          data.push_back((raw >> 24) & 0xFF);
                        }
                      }

                      const size_t written = id(aic3204_speaker).play(
                          data.data(), data.size(), pdMS_TO_TICKS(10));
                      if (written != data.size()) {
                        ESP_LOGW("hp_sweep", "Short chunk at %+d dB: %u/%u bytes",
                                 id(hp_sweep_gain),
                                 static_cast<unsigned>(written),
                                 static_cast<unsigned>(data.size()));
                      }

                      id(hp_sweep_chunk)++;
                      if (id(hp_sweep_chunk) >= 100) {
                        id(hp_sweep_chunk) = 0;
                        id(hp_sweep_gain)++;
                      }
            - delay: 1ms
      - speaker.finish:
          id: aic3204_speaker
      - lambda: |-
          auto *codec = id(aic3204_diag);
          const bool restored =
              codec->write_byte(0x00, 0x01) &&
              codec->write_byte(0x10, id(hp_saved_l)) &&
              codec->write_byte(0x11, id(hp_saved_r)) &&
              codec->write_byte(0x00, 0x00);
          ESP_LOGI("hp_sweep", "Sweep %s; gain restore %s",
                   id(hp_sweep_failed) ? "stopped on error" : "complete",
                   restored ? "succeeded" : "FAILED");

button:
  - platform: template
    name: ${devicename}_play_test_tone
    id: aic3204_play_test_tone
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t saved_l = 0, saved_r = 0;
            if (!codec->write_byte(0x00, 0x01) ||
                !codec->read_byte(0x10, &saved_l) ||
                !codec->read_byte(0x11, &saved_r)) {
              ESP_LOGE("aic3204_test", "Cannot read headphone gain; aborting tone");
              codec->write_byte(0x00, 0x00);
              return;
            }

            // Fixed +6 dB gain for a repeatable playback test.
            if (!codec->write_byte(0x10, 0x0C) ||
                !codec->write_byte(0x11, 0x0C)) {
              ESP_LOGE("aic3204_test", "Cannot set fixed +6 dB headphone gain");
              codec->write_byte(0x10, saved_l);
              codec->write_byte(0x11, saved_r);
              codec->write_byte(0x00, 0x00);
              return;
            }

            uint8_t check_l = 0, check_r = 0;
            const bool readback =
                codec->read_byte(0x10, &check_l) &&
                codec->read_byte(0x11, &check_r);
            ESP_LOGI("aic3204_test",
                     "Fixed-tone test: gain +6 dB; HPL=%02X HPR=%02X; readback=%s",
                     check_l, check_r, readback ? "OK" : "FAILED");

            // Return to page 0 before starting I2S playback.
            codec->write_byte(0x00, 0x00);
            id(hp_saved_l) = saved_l;
            id(hp_saved_r) = saved_r;

            id(aic3204_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(aic3204_speaker).set_volume(1.0f);
            id(aic3204_speaker).set_mute_state(false);
            id(aic3204_speaker).start();

        - delay: 250ms

        # Reuse one prebuilt 100 ms PCM buffer to avoid repeated heap allocation.
        # A short scheduler yield between writes prevents starving the idle task.
        - repeat:
            count: 50
            then:
              - lambda: |-
                  static const std::vector<uint8_t> data = []() {
                    std::vector<uint8_t> samples;
                    constexpr uint32_t sample_count = 4800;  // 100 ms at 48 kHz
                    constexpr uint32_t period = 48;          // 1 kHz
                    constexpr int32_t amplitude = 0x08000000;
                    samples.reserve(sample_count * 2 * sizeof(int32_t));

                    for (uint32_t i = 0; i < sample_count; i++) {
                      const int32_t sample =
                          ((i % period) < (period / 2))
                              ? amplitude : -amplitude;
                      const uint32_t raw = static_cast<uint32_t>(sample);
                      for (uint8_t channel = 0; channel < 2; channel++) {
                        samples.push_back(raw & 0xFF);
                        samples.push_back((raw >> 8) & 0xFF);
                        samples.push_back((raw >> 16) & 0xFF);
                        samples.push_back((raw >> 24) & 0xFF);
                      }
                    }
                    return samples;
                  }();

                  const size_t written = id(aic3204_speaker).play(
                      data.data(), data.size(), pdMS_TO_TICKS(100));

                  if (written != data.size()) {
                    ESP_LOGW("aic3204_test", "Short I2S write: %u/%u bytes",
                             static_cast<unsigned>(written),
                             static_cast<unsigned>(data.size()));
                  }
              - delay: 10ms

        - speaker.finish:
            id: aic3204_speaker

        - lambda: |-
            auto *codec = id(aic3204_diag);
            const bool restored =
                codec->write_byte(0x00, 0x01) &&
                codec->write_byte(0x10, id(hp_saved_l)) &&
                codec->write_byte(0x11, id(hp_saved_r)) &&
                codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_test", "Tone playback finished; gain restore %s",
                     restored ? "succeeded" : "FAILED");


  - platform: template
    name: ${devicename}_headphone_gain_sweep
    id: aic3204_headphone_gain_sweep
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            if (!codec->write_byte(0x00, 0x01) ||
                !codec->read_byte(0x10, &id(hp_saved_l)) ||
                !codec->read_byte(0x11, &id(hp_saved_r))) {
              ESP_LOGE("hp_sweep", "Cannot read original gains; aborting");
              codec->write_byte(0x00, 0x00);
              id(hp_sweep_failed) = true;
              return;
            }

            id(hp_sweep_failed) = false;
            id(hp_sweep_gain) = -6;
            id(hp_sweep_chunk) = 0;
            ESP_LOGI("hp_sweep", "Saved gains HPL=%02X HPR=%02X",
                     id(hp_saved_l), id(hp_saved_r));

            id(aic3204_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(aic3204_speaker).set_volume(1.0f);
            id(aic3204_speaker).set_mute_state(false);
            id(aic3204_speaker).start();
        - if:
            condition:
              lambda: 'return !id(hp_sweep_failed);'
            then:
              - script.execute: hp_sweep_script
