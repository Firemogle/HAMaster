	
substitutions:
  devicename: eth_va_27test

packages:
  base_board: !include
    file: packages/poe_board_base_2.6.yaml
    vars:
      devicename: ${devicename}

# TEMPORARY AIC3204 playback test.
# Replaces the voice/audio package for this test; remove this block and restore
# the voice_board include after testing.
i2s_audio:
  - id: aic3204_i2s
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO47
    i2s_mclk_pin: GPIO48

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: audio_i2c

speaker:
  - platform: i2s_audio
    id: aic3204_speaker
    i2s_audio_id: aic3204_i2s
    i2s_dout_pin: GPIO01
    dac_type: external
    audio_dac: aic3204_dac
    sample_rate: 48000
    bits_per_sample: 32bit
    mclk_multiple: 512
    use_apll: true
    i2s_comm_fmt: stand_i2s
    channel: stereo
    timeout: 5s

pcf8574:
  - id: pcf8574_hub
    address: 0x20
    pcf8575: false
    i2c_id: i2c_channel

switch:
  - platform: gpio
    id: ${devicename}_amp_en
    name: ${devicename}_amp_en
    pin:
      pcf8574: pcf8574_hub
      number: 0
      mode:
        output: true
      inverted: false

binary_sensor:
  - platform: gpio
    id: ${devicename}_aux_det_ic
    name: ${devicename}_aux_det_ic
    pin:
      pcf8574: pcf8574_hub
      number: 1
      mode:
        input: true
      inverted: false
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: ${devicename}_aux_det_ic
            then:
              - switch.turn_off: ${devicename}_amp_en
            else:
              - switch.turn_on: ${devicename}_amp_en

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: ${devicename}_aux_det_ic
          then:
            - switch.turn_off: ${devicename}_amp_en
          else:
            - switch.turn_on: ${devicename}_amp_en

# Temporary AIC3204 register diagnostics.
i2c_device:
  - id: aic3204_diag
    address: 0x18
    i2c_id: audio_i2c

globals:
  - id: hp_saved_l
    type: uint8_t
    initial_value: '0'
  - id: hp_saved_r
    type: uint8_t
    initial_value: '0'
  - id: hp_sweep_gain
    type: int
    initial_value: '-6'
  - id: hp_sweep_failed
    type: bool
    initial_value: 'false'
  - id: hp_sweep_chunk
    type: int
    initial_value: '0'
  - id: aic3204_forum_saved_ndac
    type: uint8_t
    restore_value: no
    initial_value: '0x82'
  - id: aic3204_forum_saved_mute
    type: uint8_t
    restore_value: no
    initial_value: '0x00'
  - id: aic3204_forum_saved_r47
    type: uint8_t
    restore_value: no
    initial_value: '0x00'
  - id: aic3204_forum_saved_r48
    type: uint8_t
    restore_value: no
    initial_value: '0x00'
  - id: aic3204_forum_snapshot_ok
    type: bool
    restore_value: no
    initial_value: 'false'
    
script:
  - id: hp_sweep_script
    mode: single
    then:
      - repeat:
          count: 3600
          then:
            - if:
                condition:
                  lambda: 'return !id(hp_sweep_failed);'
                then:
                  - lambda: |-
                      auto *codec = id(aic3204_diag);
                      if (id(hp_sweep_chunk) == 0) {
                        const uint8_t gain =
                            static_cast<uint8_t>(id(hp_sweep_gain) + 6);
                        if (!codec->write_byte(0x00, 0x01) ||
                            !codec->write_byte(0x10, gain) ||
                            !codec->write_byte(0x11, gain)) {
                          ESP_LOGE("hp_sweep", "Gain write failed at %+d dB",
                                   id(hp_sweep_gain));
                          id(hp_sweep_failed) = true;
                          return;
                        }
                        uint8_t check_l = 0, check_r = 0;
                        if (!codec->read_byte(0x10, &check_l) ||
                            !codec->read_byte(0x11, &check_r)) {
                          ESP_LOGE("hp_sweep", "Gain readback failed at %+d dB",
                                   id(hp_sweep_gain));
                          id(hp_sweep_failed) = true;
                          return;
                        }
                        ESP_LOGI("hp_sweep", "STEP gain=%+d dB HPL=%02X HPR=%02X",
                                 id(hp_sweep_gain), check_l, check_r);
                      }
                      std::vector<uint8_t> data;
                      constexpr int32_t amplitude = 0x01000000;
                      data.reserve(48 * 2 * sizeof(int32_t));
                      for (uint32_t i = 0; i < 48; i++) {
                        const int32_t sample = (i < 24)
                            ? amplitude : -amplitude;
                        const uint32_t raw = static_cast<uint32_t>(sample);
                        for (uint8_t ch = 0; ch < 2; ch++) {
                          data.push_back(raw & 0xFF);
                          data.push_back((raw >> 8) & 0xFF);
                          data.push_back((raw >> 16) & 0xFF);
                          data.push_back((raw >> 24) & 0xFF);
                        }
                      }
                      const size_t written = id(aic3204_speaker).play(
                          data.data(), data.size(), pdMS_TO_TICKS(10));
                      if (written != data.size()) {
                        ESP_LOGW("hp_sweep", "Short chunk at %+d dB: %u/%u bytes",
                                 id(hp_sweep_gain),
                                 static_cast<unsigned>(written),
                                 static_cast<unsigned>(data.size()));
                      }
                      id(hp_sweep_chunk)++;
                      if (id(hp_sweep_chunk) >= 100) {
                        id(hp_sweep_chunk) = 0;
                        id(hp_sweep_gain)++;
                      }
            - delay: 1ms
      - speaker.finish:
          id: aic3204_speaker
      - lambda: |-
          auto *codec = id(aic3204_diag);
          const bool restored =
              codec->write_byte(0x00, 0x01) &&
              codec->write_byte(0x10, id(hp_saved_l)) &&
              codec->write_byte(0x11, id(hp_saved_r)) &&
              codec->write_byte(0x00, 0x00);
          ESP_LOGI("hp_sweep", "Sweep %s; gain restore %s",
                   id(hp_sweep_failed) ? "stopped on error" : "complete",
                   restored ? "succeeded" : "FAILED");
button:
  - platform: template
    name: ${devicename}_aic3204_internal_beep_forum_sequence
    id: ${devicename}_aic3204_internal_beep_forum_sequence
    entity_category: diagnostic
    on_press:
      then:
        - media_player.stop: ${devicename}_media
        - delay: 100ms
        # Phase 1: snapshot and configure. No polling loops in lambdas.
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = codec->write_byte(0x00, 0x00);
            ok = codec->read_byte(0x0B, &id(aic3204_forum_saved_ndac)) && ok;
            ok = codec->read_byte(0x40, &id(aic3204_forum_saved_mute)) && ok;
            ok = codec->read_byte(0x47, &id(aic3204_forum_saved_r47)) && ok;
            ok = codec->read_byte(0x48, &id(aic3204_forum_saved_r48)) && ok;
            id(aic3204_forum_snapshot_ok) = ok;
            if (!ok) {
              ESP_LOGE("aic3204_forum_beep", "Register snapshot failed; aborting before changes");
              return;
            }
            ESP_LOGI("aic3204_forum_beep",
                     "Starting non-blocking TI E2E sequence; saved NDAC=%02X MUTE=%02X R47=%02X R48=%02X",
                     id(aic3204_forum_saved_ndac), id(aic3204_forum_saved_mute),
                     id(aic3204_forum_saved_r47), id(aic3204_forum_saved_r48));
            if (!codec->write_byte(0x47, 0x28) ||
                !codec->write_byte(0x48, 0x28) ||
                !codec->write_byte(0x40, 0x0C)) {
              ESP_LOGE("aic3204_forum_beep", "Initial beep setup write failed");
            }
        - delay: 20ms
        # Phase 2: inspect mute status once, then advance without a busy wait.
        - lambda: |-
            if (!id(aic3204_forum_snapshot_ok)) return;
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            if (codec->write_byte(0x00, 0x00) && codec->read_byte(0x26, &value)) {
              ESP_LOGI("aic3204_forum_beep",
                       "DAC mute flags P0/R26=%02X; expected mask 0x11=%s",
                       value, (value & 0x11) == 0x11 ? "present" : "not present");
            } else {
              ESP_LOGE("aic3204_forum_beep", "Could not read DAC mute flags");
            }
            if (!codec->write_byte(0x0B, 0x02)) {
              ESP_LOGE("aic3204_forum_beep", "Failed to disable NDAC");
            }
        - delay: 5ms
        # Phase 3: trigger beep and restore the DAC clock.
        - lambda: |-
            if (!id(aic3204_forum_snapshot_ok)) return;
            auto *codec = id(aic3204_diag);
            if (!codec->write_byte(0x00, 0x00) ||
                !codec->write_byte(0x47, 0x8C)) {
              ESP_LOGE("aic3204_forum_beep", "Beep trigger write failed");
            }
        - delay: 5ms
        - lambda: |-
            if (!id(aic3204_forum_snapshot_ok)) return;
            auto *codec = id(aic3204_diag);
            if (!codec->write_byte(0x00, 0x00) ||
                !codec->write_byte(0x0B, 0x82) ||
                !codec->write_byte(0x40, 0x00)) {
              ESP_LOGE("aic3204_forum_beep", "NDAC restore/unmute write failed");
            }
        - delay: 250ms
        # Phase 4: read status once and restore saved register values.
        - lambda: |-
            if (!id(aic3204_forum_snapshot_ok)) {
              ESP_LOGW("aic3204_forum_beep", "No register snapshot; nothing to restore");
              return;
            }
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool restore_ok = codec->write_byte(0x00, 0x00);
            if (codec->read_byte(0x47, &value)) {
              ESP_LOGI("aic3204_forum_beep", "Post-beep P0/R47=%02X (bit7 %s)",
                       value, (value & 0x80) ? "set" : "clear");
            } else {
              ESP_LOGW("aic3204_forum_beep", "Post-beep R47 read failed");
            }
            restore_ok = codec->write_byte(0x47, 0x00) && restore_ok;
            restore_ok = codec->write_byte(0x0B, id(aic3204_forum_saved_ndac)) && restore_ok;
            restore_ok = codec->write_byte(0x40, id(aic3204_forum_saved_mute)) && restore_ok;
            restore_ok = codec->write_byte(0x47, id(aic3204_forum_saved_r47)) && restore_ok;
            restore_ok = codec->write_byte(0x48, id(aic3204_forum_saved_r48)) && restore_ok;
            restore_ok = codec->write_byte(0x00, 0x00) && restore_ok;
            id(aic3204_forum_snapshot_ok) = false;
            ESP_LOGI("aic3204_forum_beep", "Non-blocking TI E2E beep test complete; restore=%s",
                     restore_ok ? "OK" : "ERROR");
        - delay: 1s
  - platform: template
    name: ${devicename}_play_test_tone
    id: aic3204_play_test_tone
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t saved_l = 0, saved_r = 0;
            if (!codec->write_byte(0x00, 0x01) ||
                !codec->read_byte(0x10, &saved_l) ||
                !codec->read_byte(0x11, &saved_r)) {
              ESP_LOGE("aic3204_test", "Cannot read headphone gain; aborting tone");
              codec->write_byte(0x00, 0x00);
              return;
            }
            if (!codec->write_byte(0x10, 0x0C) ||
                !codec->write_byte(0x11, 0x0C)) {
              ESP_LOGE("aic3204_test", "Cannot set fixed +6 dB headphone gain");
              codec->write_byte(0x10, saved_l);
              codec->write_byte(0x11, saved_r);
              codec->write_byte(0x00, 0x00);
              return;
            }
            uint8_t check_l = 0, check_r = 0;
            const bool readback =
                codec->read_byte(0x10, &check_l) &&
                codec->read_byte(0x11, &check_r);
            ESP_LOGI("aic3204_test",
                     "Fixed-tone test: gain +6 dB; HPL=%02X HPR=%02X; readback=%s",
                     check_l, check_r, readback ? "OK" : "FAILED");
            codec->write_byte(0x00, 0x00);
            id(hp_saved_l) = saved_l;
            id(hp_saved_r) = saved_r;
            id(aic3204_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(aic3204_speaker).set_volume(1.0f);
            id(aic3204_speaker).set_mute_state(false);
            id(aic3204_speaker).start();
        - delay: 250ms
        - repeat:
            count: 50
            then:
              - lambda: |-
                  static const std::vector<uint8_t> data = []() {
                    std::vector<uint8_t> samples;
                    constexpr uint32_t sample_count = 4800;
                    constexpr uint32_t period = 48;
                    constexpr int32_t amplitude = 0x08000000;
                    samples.reserve(sample_count * 2 * sizeof(int32_t));
                    for (uint32_t i = 0; i < sample_count; i++) {
                      const int32_t sample =
                          ((i % period) < (period / 2))
                              ? amplitude : -amplitude;
                      const uint32_t raw = static_cast<uint32_t>(sample);
                      for (uint8_t channel = 0; channel < 2; channel++) {
                        samples.push_back(raw & 0xFF);
                        samples.push_back((raw >> 8) & 0xFF);
                        samples.push_back((raw >> 16) & 0xFF);
                        samples.push_back((raw >> 24) & 0xFF);
                      }
                    }
                    return samples;
                  }();
                  const size_t written = id(aic3204_speaker).play(
                      data.data(), data.size(), pdMS_TO_TICKS(100));
                  if (written != data.size()) {
                    ESP_LOGW("aic3204_test", "Short I2S write: %u/%u bytes",
                             static_cast<unsigned>(written),
                             static_cast<unsigned>(data.size()));
                  }
              - delay: 10ms

        - speaker.finish:
            id: aic3204_speaker

        - lambda: |-
            auto *codec = id(aic3204_diag);
            const bool restored =
                codec->write_byte(0x00, 0x01) &&
                codec->write_byte(0x10, id(hp_saved_l)) &&
                codec->write_byte(0x11, id(hp_saved_r)) &&
                codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_test", "Tone playback finished; gain restore %s",
                     restored ? "succeeded" : "FAILED");
  - platform: template
    name: ${devicename}_headphone_gain_sweep
    id: aic3204_headphone_gain_sweep
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            if (!codec->write_byte(0x00, 0x01) ||
                !codec->read_byte(0x10, &id(hp_saved_l)) ||
                !codec->read_byte(0x11, &id(hp_saved_r))) {
              ESP_LOGE("hp_sweep", "Cannot read original gains; aborting");
              codec->write_byte(0x00, 0x00);
              id(hp_sweep_failed) = true;
              return;
            }
            id(hp_sweep_failed) = false;
            id(hp_sweep_gain) = -6;
            id(hp_sweep_chunk) = 0;
            ESP_LOGI("hp_sweep", "Saved gains HPL=%02X HPR=%02X",
                     id(hp_saved_l), id(hp_saved_r));
            id(aic3204_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(aic3204_speaker).set_volume(1.0f);
            id(aic3204_speaker).set_mute_state(false);
            id(aic3204_speaker).start();
        - if:
            condition:
              lambda: 'return !id(hp_sweep_failed);'
            then:
              - script.execute: hp_sweep_script

  - platform: template
    name: ${devicename}_read_codec_path_registers
    id: aic3204_read_path_registers
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = true;
            // Page 1: headphone driver power/routing and startup controls.
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_diag", "Cannot select page 1");
              return;
            }
            const uint8_t page1_regs[] = {0x09, 0x0C, 0x0D, 0x10, 0x11, 0x14, 0x3F};
            for (const uint8_t reg : page1_regs) {
              if (codec->read_byte(reg, &value)) {
                ESP_LOGI("aic3204_diag", "P1 R%02X = %02X", reg, value);
              } else {
                ESP_LOGE("aic3204_diag", "Read failed P1 R%02X", reg);
                ok = false;
              }
            }
            // Page 0: DAC power/status flags plus setup and digital volume.
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_diag", "Cannot select page 0");
              return;
            }
            const uint8_t page0_regs[] = {0x25, 0x26, 0x3F, 0x40, 0x41, 0x42};
            for (const uint8_t reg : page0_regs) {
              if (codec->read_byte(reg, &value)) {
                ESP_LOGI("aic3204_diag", "P0 R%02X = %02X", reg, value);
              } else {
                ESP_LOGE("aic3204_diag", "Read failed P0 R%02X", reg);
                ok = false;
              }
            }
            ESP_LOGI("aic3204_diag", "Codec path register dump %s",
                     ok ? "complete" : "had read errors");
  - platform: template
    name: ${devicename}_run_full_codec_diagnostic
    id: aic3204_full_diagnostic
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("aic3204_cycle", "========== FULL CODEC DIAGNOSTIC: START ==========");
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = true;
            if (!codec->write_byte(0x00, 0x01)) {
              ESP_LOGE("aic3204_cycle", "Cannot select page 1");
              return;
            }
            const uint8_t regs[] = {0x09, 0x0C, 0x0D, 0x10, 0x11, 0x14, 0x3F};
            for (const uint8_t reg : regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_cycle", "BEFORE P1 R%02X = %02X", reg, value);
              else { ESP_LOGE("aic3204_cycle", "Read failed P1 R%02X", reg); ok = false; }
            }
            if (!ok) {
              codec->write_byte(0x00, 0x00);
              ESP_LOGE("aic3204_cycle", "Aborting: initial Page 1 reads failed");
              return;
            }
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = true;
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_cycle", "Cannot select page 0");
              return;
            }
            const uint8_t regs[] = {0x04, 0x05, 0x06, 0x1B, 0x1C, 0x1D, 0x1E, 0x1F,
                                    0x25, 0x26, 0x3F, 0x40, 0x41, 0x42};
            for (const uint8_t reg : regs) {
              if (codec->read_byte(reg, &value))
                ESP_LOGI("aic3204_cycle", "BEFORE P0 R%02X = %02X", reg, value);
              else { ESP_LOGE("aic3204_cycle", "Read failed P0 R%02X", reg); ok = false; }
            }
            if (!ok) ESP_LOGE("aic3204_cycle", "Some initial Page 0 reads failed; continuing");
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t saved_l = 0, saved_r = 0;
            if (!codec->write_byte(0x00, 0x01) ||
                !codec->read_byte(0x10, &saved_l) ||
                !codec->read_byte(0x11, &saved_r)) {
              ESP_LOGE("aic3204_cycle", "Cannot read headphone gains; aborting playback");
              codec->write_byte(0x00, 0x00);
              return;
            }
            if (!codec->write_byte(0x10, 0x0C) || !codec->write_byte(0x11, 0x0C)) {
              ESP_LOGE("aic3204_cycle", "Cannot set test gain; aborting playback");
              codec->write_byte(0x10, saved_l);
              codec->write_byte(0x11, saved_r);
              codec->write_byte(0x00, 0x00);
              return;
            }
            uint8_t check_l = 0, check_r = 0;
            const bool readback = codec->read_byte(0x10, &check_l) &&
                                  codec->read_byte(0x11, &check_r);
            ESP_LOGI("aic3204_cycle", "PLAYBACK: temporary HPL=%02X HPR=%02X readback=%s",
                     check_l, check_r, readback ? "OK" : "FAILED");
            codec->write_byte(0x00, 0x00);
            id(hp_saved_l) = saved_l;
            id(hp_saved_r) = saved_r;
            id(aic3204_speaker).set_audio_stream_info(
                esphome::audio::AudioStreamInfo(32, 2, 48000));
            id(aic3204_speaker).set_volume(1.0f);
            id(aic3204_speaker).set_mute_state(false);
            id(aic3204_speaker).start();
        - delay: 250ms
        - repeat:
            count: 50
            then:
              - lambda: |-
                  static const std::vector<uint8_t> data = []() {
                    std::vector<uint8_t> samples;
                    constexpr uint32_t sample_count = 4800;
                    constexpr uint32_t period = 48;
                    constexpr int32_t amplitude = 0x08000000;
                    samples.reserve(sample_count * 2 * sizeof(int32_t));
                    for (uint32_t i = 0; i < sample_count; i++) {
                      const int32_t sample = ((i % period) < (period / 2))
                          ? amplitude : -amplitude;
                      const uint32_t raw = static_cast<uint32_t>(sample);
                      for (uint8_t channel = 0; channel < 2; channel++) {
                        samples.push_back(raw & 0xFF);
                        samples.push_back((raw >> 8) & 0xFF);
                        samples.push_back((raw >> 16) & 0xFF);
                        samples.push_back((raw >> 24) & 0xFF);
                      }
                    }
                    return samples;
                  }();
                  const size_t written = id(aic3204_speaker).play(
                      data.data(), data.size(), pdMS_TO_TICKS(100));
                  if (written != data.size())
                    ESP_LOGW("aic3204_cycle", "Short I2S write: %u/%u bytes",
                             static_cast<unsigned>(written), static_cast<unsigned>(data.size()));
              - delay: 10ms
        - speaker.finish:
            id: aic3204_speaker
        - lambda: |-
            auto *codec = id(aic3204_diag);
            const bool restored = codec->write_byte(0x00, 0x01) &&
                codec->write_byte(0x10, id(hp_saved_l)) &&
                codec->write_byte(0x11, id(hp_saved_r)) &&
                codec->write_byte(0x00, 0x00);
            ESP_LOGI("aic3204_cycle", "Playback finished; headphone gain restore %s",
                     restored ? "succeeded" : "FAILED");
        - delay: 100ms
        - lambda: |-
            auto *codec = id(aic3204_diag);
            uint8_t value = 0;
            bool ok = true;
            if (!codec->write_byte(0x00, 0x00)) {
              ESP_LOGE("aic3204_cycle", "Cannot select page 0 for final snapshot");
              return;
            }
            const uint8_t regs[] = {0x1B, 0x1C, 0x1D, 0x1E, 0x1F, 0x25, 0x26,
                                    0x3F, 0x40, 0x41, 0x42};
            for (const uint8_t reg : regs) {
              if (codec->read_byte(reg, &value))
